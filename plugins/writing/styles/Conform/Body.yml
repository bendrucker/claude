# `body.required: true`: conform takes any non-empty line after the header
# that is not a `Signed-off-by:` line as body, trailers included. Read from
# the raw message, past Git's own lines, so the answer is conform's.
extends: script
message: "Commit body is empty."
link: https://github.com/siderolabs/conform#commit-policy
level: error
scope: raw
script: |
  text := import("text")
  matches := []
  pos := 0
  title := -1
  t_end := 0
  found := false
  for line in text.split(scope, "\n") {
    next := pos + len(line) + 1
    if text.re_match(`^#\s*-+\s*>8\s*-+\s*$`, line) {
      break
    }
    if text.has_prefix(line, "#") {
      pos = next
      continue
    }
    if title < 0 {
      if text.trim_space(line) != "" {
        title = pos
        t_end = pos + len(line)
      }
      pos = next
      continue
    }
    if text.trim_space(line) != "" && !text.re_match(`^Signed-off-by: [^<]+ <[^<>@]+@[^<>]+>$`, text.trim_space(line)) {
      found = true
    }
    pos = next
  }
  if title >= 0 && !found {
    matches = append(matches, {begin: title, end: t_end})
  }

tests:
  - name: "sign-off only"
    about: "a DCO line is not body, and nothing else follows the header"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      add the parser

      Signed-off-by: Jane Doe <jane@example.com>
    want: |
      1:1:Conform.Body:Commit body is empty.
  - name: "before"
    about: "the README's sample policy, most checks failing at once"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      Added the parser, in a header that runs past the eighty-nine characters that conform allows.

      Signed-off-by: J
    want: ""
  - name: "after"
    about: "the rewrite"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      add the parser

      The parser reads the file into a tree that the rest of the tool
      walks.

      Signed-off-by: Jane Doe <jane@example.com>
    want: ""

# "don't capitalize the first letter". A capital followed by a lower-case
# letter is a capitalized word; `URL` and `HttpClient` are names and pass.
extends: Commits._shared.Capitalized
message: "The summary is not capitalized: '%s'."
link: https://github.com/angular/angular/blob/main/contributing-docs/commit-message-guidelines.md#summary
level: error

tests:
  - name: "before"
    about: "a type outside the list, capitalized twice, a period, and a body under 20 characters"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      Chore(core): Add a thing.

      Short.
    want: |
      1:14:Angular.Capitalized:The summary is not capitalized: 'Add'.
  - name: "after"
    about: "the rewrite"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      fix(core): handle an empty scope in the parser

      An empty scope produced a header that the changelog generator rejected.

      Fixes #123
    want: ""
  - name: "guards"
    about: "docs needs no body"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      docs: fix typo in tutorial
    want: ""
  - name: "guards-revert"
    about: "a revert that names the commit"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      revert: feat(core): add a thing

      This reverts commit 42e769bdf4894310333942ffc5a15151222a87be. The change
      broke the build on Windows and needs a different approach.
    want: ""

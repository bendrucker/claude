# `header.case: lower`: the first character of the first word is a lower-case
# letter, so a digit or a bracket fails as it does in conform. With a
# conventional block configured, conform reads the description after the
# prefix, and its regex lets the type be empty; the second token does the
# same, and the first applies to a header with no prefix.
extends: existence
message: "Commit header case is not lower: '%s'."
link: https://github.com/siderolabs/conform#commit-policy
level: error
scope: subject
nonword: true
tokens:
  - '^(?!\w*(?:\([^)]*\))?!?: )[^\p{Ll}\s]\S*'
  - '(?<=^\w*(?:\([^)]*\))?!?: )[^\p{Ll}\s]\S*'

tests:
  - name: "before"
    about: "the README's sample policy, most checks failing at once"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      Added the parser, in a header that runs past the eighty-nine characters that conform allows.

      Signed-off-by: J
    want: |
      1:1:Conform.HeaderCase:Commit header case is not lower: 'Added'.
  - name: "after"
    about: "the rewrite"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      add the parser

      The parser reads the file into a tree that the rest of the tool
      walks.

      Signed-off-by: Jane Doe <jane@example.com>
    want: ""

<svg xmlns="http://www.w3.org/2000/svg" width="375" height="200" viewBox="0 0 375 200">
  <rect width="375" height="200" fill="white" stroke="black" stroke-dasharray="4"/>

  <!-- Two buttons that overlap each other -->
  <g transform="translate(16,80)">
    <rect width="180" height="44" fill="none" stroke="black"/>
    <text font-family="sans-serif" x="90" y="28" text-anchor="middle" font-size="14" fill="black">Cancel</text>
  </g>

  <g transform="translate(150,80)">
    <rect width="180" height="44" fill="none" stroke="black"/>
    <text font-family="sans-serif" x="90" y="28" text-anchor="middle" font-size="14" fill="black">Submit</text>
  </g>
</svg>

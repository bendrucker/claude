# evidence: the TS hook's comment-splice check, whose run-on comments ai-tells.SemicolonUsage misses without a closing period.
# retire when: ai-tells.SemicolonUsage matches a clause-final splice with no terminal punctuation.
extends: existence
message: "'%s' joins two clauses with a semicolon. Split the comment into two sentences."
level: warning
scope: comment
nonword: true
tokens:
  - '[a-z]+; [a-z]+'
tests:
  - name: positives
    about: a spliced comment with no closing period
    format: .ts
    input: |
      // keep sorted; callers rely on order
      const x = 1;
    want: |
      1:9:Writing.CommentSplice:'sorted; callers' joins two clauses with a semicolon. Split the comment into two sentences.
  - name: negatives
    about: commented-out code and a semicolon in a string
    format: .ts
    input: |
      // foo(); bar()
      const label = "cold start; warm later";
    want: ""

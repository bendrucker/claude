# evidence: 2026-06 corpus comparison put the consequence-chain rate at ~3/1k words in AI-era
#   deliverables. Hook promotion requires cross-project validation.
# retire when: the consequence-chain rate in deliverables falls below 1/1k words or matches the
#   hand-written baseline.
extends: existence
message: "'%s' chains a consequence onto the clause. Split into two sentences. State the cause and effect separately."
level: warning
nonword: true
ignorecase: true
tokens:
  - ',\s*so\s+(?:the|an?|this|these|those|its|their|our|my|your|his|her|each|every|any|some|all|both|either|neither|no|it|they|there|that(?!\s+(?:the|an?|this|these|those|its|their|our|my|your|his|her|each|every|any|some|all|no|it|they|we|you|he|she|i|there)\b))\b'
tests:
  - name: "flags The cache fills up, so the old entries get evicted."
    input: |
      The cache fills up, so the old entries get evicted.
    contains: [Writing.ConsequenceChain]
  - name: "flags The worker finishes, so the queue clears."
    input: |
      The worker finishes, so the queue clears.
    contains: [Writing.ConsequenceChain]
  - name: "flags The flag is unset, so it falls back to the default."
    input: |
      The flag is unset, so it falls back to the default.
    contains: [Writing.ConsequenceChain]
  - name: "flags Both writers hold the lock, so neither request proceeds."
    input: |
      Both writers hold the lock, so neither request proceeds.
    contains: [Writing.ConsequenceChain]
  - name: "flags The migration ran twice, so that table has duplicate rows."
    input: |
      The migration ran twice, so that table has duplicate rows.
    contains: [Writing.ConsequenceChain]
  - name: "allows So the next step is to fix the test."
    input: |
      So the next step is to fix the test.
    absent: Writing.ConsequenceChain
  - name: "allows This happens because the cache is full."
    input: |
      This happens because the cache is full.
    absent: Writing.ConsequenceChain
  - name: "allows Pin the version, so that the build stays reproducible."
    input: |
      Pin the version, so that the build stays reproducible.
    absent: Writing.ConsequenceChain
  - name: "allows The queue is long, so long that it stalls."
    input: |
      The queue is long, so long that it stalls.
    absent: Writing.ConsequenceChain
  - name: "allows Retry once, or so the docs suggest."
    input: |
      Retry once, or so the docs suggest.
    absent: Writing.ConsequenceChain
  - name: "allows The tests never passed in CI, so I rewrote them."
    input: |
      The tests never passed in CI, so I rewrote them.
    absent: Writing.ConsequenceChain
  - name: "allows The page was blank, so you reload it."
    input: |
      The page was blank, so you reload it.
    absent: Writing.ConsequenceChain

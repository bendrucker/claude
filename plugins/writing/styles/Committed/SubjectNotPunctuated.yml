# `subject_not_punctuated = true`: the subject's last character is not a
# space, a period, `!`, or `?`, which is committed's set, read before any
# trimming, so a trailing space counts.
extends: existence
message: "subject_not_punctuated: '%s'."
link: https://github.com/crate-ci/committed/blob/master/docs/reference.md
level: error
scope: subject
nonword: true
raw:
  - '[ .!?]$'

tests:
  - name: "before"
    about: "committed's defaults, most of them at once"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      wip: added the parser, which took a while!

      A body line that is long enough to run past the seventy-two columns allowed.
    want: |
      1:42:Committed.SubjectNotPunctuated:subject_not_punctuated: '!'.
  - name: "after"
    about: "the rewrite"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      Add the parser

      A body wrapped at seventy-two columns, as the default asks.
    want: ""

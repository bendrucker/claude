# evidence: user-flagged as the flagship gen-5 tell. The gen-5 corpus audit found 27.8 per million assistant characters versus 3.4 in typed user text, and a verify pass judged 43% of uses bare gravity markers.
# retire when: the gen-5+ assistant rate falls under 5/M in a corpus audit window, or a labeling pass shows most surviving uses name the dependency in-sentence.
extends: existence
message: "'%s' asserts importance by metaphor. Name the dependency instead: say what breaks or changes without it."
level: error
ignorecase: true
tokens:
  - '\bload[\s-]bearing\b'
tests:
  - name: "flags That comment is load-bearing for the retry logic."
    input: |
      That comment is load-bearing for the retry logic.
    contains: [Writing.LoadBearing]
  - name: "flags The ordering here is load bearing."
    input: |
      The ordering here is load bearing.
    contains: [Writing.LoadBearing]
  - name: "allows Removing the check breaks the parser."
    input: |
      Removing the check breaks the parser.
    absent: Writing.LoadBearing
  - name: "allows The retry logic depends on this ordering."
    input: |
      The retry logic depends on this ordering.
    absent: Writing.LoadBearing

# Structure and register rules for files, not for a message body.
Writing.FloweryPhrases = NO
Writing.BoldLabel = NO
Writing.TrailingHedge = NO
Writing.ConsequenceChain = NO
Writing.SoftPhrasing = NO
Writing.SemicolonSplice = NO

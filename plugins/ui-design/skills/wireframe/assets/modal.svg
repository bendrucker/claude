<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Background page (dimmed representation) -->
  <rect width="600" height="400" fill="white" stroke="black" stroke-dasharray="4"/>

  <!-- Page content behind modal (shown with dashed lines) -->
  <g transform="translate(0,0)">
    <line x1="20" y1="50" x2="200" y2="50" stroke="black" stroke-dasharray="8"/>
    <line x1="20" y1="80" x2="400" y2="80" stroke="black" stroke-dasharray="8"/>
    <line x1="20" y1="100" x2="350" y2="100" stroke="black" stroke-dasharray="8"/>
  </g>

  <!-- Modal dialog -->
  <g transform="translate(100,80)">
    <!-- Modal container -->
    <rect width="400" height="240" fill="white" stroke="black"/>

    <!-- Modal header -->
    <g transform="translate(0,0)">
      <rect width="400" height="48" fill="none" stroke="black"/>
      <text font-family="sans-serif" x="20" y="30" font-size="14" fill="black">Confirm Action</text>
      <text font-family="sans-serif" x="370" y="30" font-size="16" fill="black">×</text>
    </g>

    <!-- Modal body -->
    <g transform="translate(20,68)">
      <text font-family="sans-serif" x="0" y="20" font-size="12" fill="black">Are you sure you want to proceed?</text>
      <line x1="0" y1="48" x2="300" y2="48" stroke="black"/>
      <line x1="0" y1="68" x2="280" y2="68" stroke="black"/>
      <line x1="0" y1="88" x2="200" y2="88" stroke="black"/>
    </g>

    <!-- Modal footer -->
    <g transform="translate(0,192)">
      <rect width="400" height="48" fill="none" stroke="black" stroke-dasharray="4"/>
      <!-- Cancel button -->
      <g transform="translate(180,8)">
        <rect width="100" height="32" fill="none" stroke="black"/>
        <text font-family="sans-serif" x="50" y="22" text-anchor="middle" font-size="12" fill="black">Cancel</text>
      </g>
      <!-- Confirm button -->
      <g transform="translate(290,8)">
        <rect width="100" height="32" fill="none" stroke="black"/>
        <text font-family="sans-serif" x="50" y="22" text-anchor="middle" font-size="12" fill="black">Confirm</text>
      </g>
    </g>
  </g>
</svg>

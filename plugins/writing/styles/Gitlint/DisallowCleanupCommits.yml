# CC2 `contrib-disallow-cleanup-commits`: no `fixup!`, `squash!`, or
# `amend!`. A contrib rule, so off by default; meant for a run over history,
# where one of these means an autosquash never happened.
extends: existence
message: "CC2 contrib-disallow-cleanup-commits: '%s'."
link: https://jorisroovers.com/gitlint/latest/rules/contrib_rules/#cc2-contrib-disallow-cleanup-commits
level: error
scope: subject
nonword: true
raw:
  - '^(?:fixup|squash|amend)!'

tests:
  - name: "cleanup"
    about: "the contrib rule, on"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      fixup! Add the parser

      Squashed later, or meant to be.
    want: |
      1:1:Gitlint.DisallowCleanupCommits:CC2 contrib-disallow-cleanup-commits: 'fixup!'.
  - name: "after"
    about: "the rewrite"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      Add fixed-point parsing to the tokenizer

      Numbers with a decimal point were read as two integers, and the
      second one lost its sign.
    want: ""
  - name: "guards"
    about: "WIPING is a word that contains WIP and passes, as in gitlint"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      Stop WIPING the cache on every request

      The cache was cleared by the request handler rather than by the
      scheduler, so it never held anything for long.
    want: ""

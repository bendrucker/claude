schema_version: "1.1"
name: short-run
tags: [setup, dev]
plugins: ["../../.."]
execution:
  model: claude-sonnet-5-5
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]
  append_system_prompt: >-
    Nobody answers while you work, so reply once. Don't edit the program's
    source. End the reply with the leads as a numbered markdown list, best
    first, each with its share of the run.
context:
  scaffold_script: fixture.sh

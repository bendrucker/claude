name: test

on:
  pull_request: {}
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: mcps/cli
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcps/cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run type-check

  install:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake
      THINGS_AUTH_TOKEN: fake
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcps/cli/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mcps/cli

      - name: Run install script
        run: ./install.sh

  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcps/cli/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: mcps/go.mod
          cache-dependency-path: mcps/go.sum

      - name: Install Go tools
        run: go install golang.org/x/tools/gopls@latest

      - name: Install dependencies
        run: npm ci
        working-directory: mcps/cli

      - name: Install TypeScript language server
        run: npm install -g typescript-language-server typescript

      - name: Validate configuration
        run: ./bin/mcp.js validate ..
        working-directory: mcps/cli

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run tools command from parent directory
        run: ./mcps/cli/bin/mcp.js tools mcps --exclude github

      - name: Test npm binary configuration
        run: |
          # Link the MCP CLI globally to simulate local development
          cd mcps/cli && npm link
          
          # Create a test mcps configuration to verify npm binary field works
          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"
          
          # Create minimal mcps.json with playwright configuration
          cat > mcps.json << 'EOF'
          {
            "$schema": "./schema/mcps.json", 
            "servers": {
              "playwright": {
                "runner": {
                  "npm": {
                    "package": "@playwright/mcp",
                    "binary": "mcp-server-playwright"
                  }
                },
                "targets": {
                  "scope": "user"
                }
              }
            }
          }
          EOF
          
          # Install the playwright package 
          npm install @playwright/mcp
          
          # Test that the MCP CLI can start the server with binary configuration
          timeout 5s mcp tools . --server playwright || echo "Expected timeout - server started correctly"
          
          echo "✓ npm binary configuration test passed"

  hooks:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      THINGS_AUTH_TOKEN: fake
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcps/cli/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mcps/cli

      - name: Install tsx
        run: npm install -g tsx

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Install ShellSpec
        run: curl -fsSL https://git.io/shellspec | sh -s -- --yes 0.28.1

      - name: Setup Claude configuration
        run: ./install.sh
        env:
          GITHUB_TOKEN: fake

      - name: Run hook tests
        run: shellspec
        working-directory: .claude/hooks

  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          folder-path: '.claude/'
          file-path: './CLAUDE.md'

schema_version: "1.1"
name: named-in-body
tags: [dev]
plugins: ["../../.."]
execution:
  model: claude-sonnet-5-5
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  append_system_prompt: >-
    This sandbox has no network. The gh CLI answers from a read-only snapshot
    of the PR and refuses any write. The PR branch is checked out in the
    working directory. Nobody answers while you work, so skip any confirmation
    step and stop before posting. Reply with the review comments you would
    post, exactly as they would read on the PR, between a line holding only
    <comments> and a line holding only </comments>. Anything else you say goes
    outside the tags.
context:
  scaffold_script: fixture.sh

query PRContext($owner: String!, $repo: String!, $number: Int!) {
  repository(owner: $owner, name: $repo) {
    pullRequest(number: $number) {
      title
      body
      lastEditedAt
      commits(last: 30) {
        nodes {
          commit {
            oid
            message
            committedDate
          }
        }
      }
    }
  }
}

name: test

on:
  pull_request: {}
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate shared files
        run: node scripts/validate-shared.mjs

      - name: Check marketplace completeness
        run: ./scripts/check-marketplace.sh

      - name: List local plugins
        id: list
        run: |
          plugins=$(jq -c '[.plugins[] | select(.source | type == "string" and startswith("./plugins/")) | .name]' .claude-plugin/marketplace.json)
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

  plugin:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.validate.outputs.plugins) }}
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_REPO_HOME: ${{ github.workspace }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Inspect plugin
        id: inspect
        run: |
          plugin="${{ matrix.plugin }}"
          echo "has_plugin_json=$([[ -f "plugins/$plugin/.claude-plugin/plugin.json" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_hooks=$([[ -f "plugins/$plugin/hooks/hooks.json" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_skills=$([[ -d "plugins/$plugin/skills" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_agents=$([[ -d "plugins/$plugin/agents" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_commands=$([[ -d "plugins/$plugin/commands" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_spec=$([[ -f "plugins/$plugin/spec.sh" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_package=$([[ -f "plugins/$plugin/package.json" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate plugin.json
        if: steps.inspect.outputs.has_plugin_json == 'true'
        run: node scripts/validate-plugin.mjs "plugins/${{ matrix.plugin }}"

      - name: Validate hooks.json
        if: steps.inspect.outputs.has_hooks == 'true'
        run: node scripts/validate-hooks.mjs "plugins/${{ matrix.plugin }}"

      - name: Validate skill frontmatter
        if: steps.inspect.outputs.has_skills == 'true'
        run: npx remark "plugins/${{ matrix.plugin }}/skills/*/SKILL.md"

      - name: Validate agent frontmatter
        if: steps.inspect.outputs.has_agents == 'true'
        run: npx remark "plugins/${{ matrix.plugin }}/agents/*.md"

      - name: Validate command frontmatter
        if: steps.inspect.outputs.has_commands == 'true'
        run: npx remark "plugins/${{ matrix.plugin }}/commands/*.md"

      - name: Install Claude Code CLI
        if: steps.inspect.outputs.has_spec == 'true'
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Install ShellSpec
        if: steps.inspect.outputs.has_spec == 'true'
        run: curl -fsSL https://git.io/shellspec | sh -s -- --yes 0.28.1

      - name: Setup Claude configuration
        if: steps.inspect.outputs.has_spec == 'true'
        run: CLAUDE_REPO_HOME="$GITHUB_WORKSPACE" ./install.sh

      - name: Run ShellSpec tests
        if: steps.inspect.outputs.has_spec == 'true'
        run: shellspec "plugins/${{ matrix.plugin }}/spec.sh" --tag unit

      - name: Install package dependencies
        if: steps.inspect.outputs.has_package == 'true'
        run: npm ci --prefix "plugins/${{ matrix.plugin }}"

      - name: Build TypeScript
        if: steps.inspect.outputs.has_package == 'true'
        run: npm run build --prefix "plugins/${{ matrix.plugin }}" --if-present

  plugins:
    needs: plugin
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check plugin results
        run: |
          if [[ "${{ needs.plugin.result }}" != "success" ]]; then
            echo "Plugin validation failed"
            exit 1
          fi

  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          folder-path: '.claude/'
          file-path: './CLAUDE.md'

  context:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_REPO_HOME: ${{ github.workspace }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Setup Claude configuration
        run: CLAUDE_REPO_HOME="$GITHUB_WORKSPACE" ./install.sh

      - name: Generate context report
        run: |
          mkdir -p tmp
          echo '## Claude Code Context Usage' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          claude --print '/context' --output-format json --verbose | jq -r '.[1].message.content' | awk '/<local-command-stdout>/{flag=1;next}/<\/local-command-stdout>/{flag=0}flag' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

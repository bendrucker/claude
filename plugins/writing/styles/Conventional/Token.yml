# "A footer's token MUST use - in place of whitespace characters, e.g.,
# Acked-by (this helps differentiate the footer section from a
# multi-paragraph body)." A token with a space in it opens no trailer block,
# so it is read as body; inside a block it continues the value above it.
# The rule looks in both for the common ones.
extends: existence
message: "A footer token uses '-' in place of whitespace: 'Signed-off-by', not '%s'."
link: https://www.conventionalcommits.org/en/v1.0.0/#specification
level: error
scope:
  - body
  - trailer
ignorecase: true
nonword: true
raw:
  - '(?m)^(?:signed off by|co authored by|reviewed by|acked by|tested by|reported by|suggested by|helped by|see also)(?=: | #)'

tests:
  - name: "before"
    about: "a footer glued to the body, a lower-case BREAKING CHANGE, a token with spaces"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      feat(parser)!: allow config objects to extend other configs

      The `extends` key is read before the rest of the file.
      Fixes #12

      Breaking change: the key was ignored before.
      Signed off by: Jane Doe <jane@example.com>
    want: |
      7:1:Conventional.Token:A footer token uses '-' in place of whitespace: 'Signed-off-by', not 'Signed off by'.
  - name: "after"
    about: "the rewrite"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      feat(parser)!: allow config objects to extend other configs

      The `extends` key is read before the rest of the file.

      BREAKING CHANGE: the key was ignored before.
      Signed-off-by: Jane Doe <jane@example.com>
      Fixes #12
    want: ""
  - name: "guards"
    about: "prose that looks like a footer is body, and real footers after a blank line pass"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      docs: correct spelling of CHANGELOG

      Note: a line like this one is prose, and so is the next.
      Reviewed by the team, not a trailer.

      Reviewed-by: Z
      Refs: #123
    want: ""

StylesPath = styles
MinAlertLevel = suggestion

# Hook prose that is not a file: PR/issue/comment bodies and MCP text, and git messages.
[formats]
prbody = md
commitmsg = md

[*]
BasedOnStyles = Writing

# Offers and permission-seeking belong to a reply, not to a file's prose.
Writing.HedgingClose = NO
Writing.PermissionSeeking = NO


# evidence: pre-dates the curation principle, with no corpus evidence recorded. Kept because the construction is consistently wrong in practice.
# retire when: corrective feedback stops citing it, or corpus spot-checks show it flagging legitimate usage.
extends: existence
message: "'%s' avoids a simple copula. Use 'is' or 'are' instead."
link: https://github.com/bendrucker/claude/blob/main/plugins/writing/styles/Writing/CopulaAvoidance.yml
level: error
ignorecase: true
tokens:
  - '(?:serves|stands) as'
tests:
  - name: "flags the serves-as copula"
    input: |
      The module serves as the entry point.
    contains: [Writing.CopulaAvoidance]
  - name: "flags the stands-as copula"
    input: |
      This stands as a reminder.
    contains: [Writing.CopulaAvoidance]
  - name: "allows serves with an object"
    input: |
      The restaurant serves food.
    absent: Writing.CopulaAvoidance
  - name: "allows stands as posture"
    input: |
      She stands at the podium.
    absent: Writing.CopulaAvoidance

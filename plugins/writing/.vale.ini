StylesPath = styles
MinAlertLevel = suggestion

# The packages the dotfiles global config syncs, vendored under styles/ so the plugin
# lints the same on a machine without that config or network access.
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip, \
  https://github.com/jdkato/commits/releases/download/v0.2.0/Commits.zip, \
  https://github.com/vale-cli/readability/releases/download/v0.2.0/Readability.zip

# Hook prose that is not a file: PR/issue/comment bodies and MCP text, and git messages.
[formats]
prbody = md
commitmsg = md

[*]
BasedOnStyles = ai-tells, Writing

# Offers, greetings, and acknowledgments belong to a reply, not to a file's prose.
Writing.HedgingClose = NO
Writing.PermissionSeeking = NO
Writing.Salutation = NO
Writing.SycophanticAcknowledgment = NO
Writing.IUnderstand = NO

# ai-tells levels from `vale-gate.ts sweep`: lift is the rate on model drafts over
# the rate on the voice baseline. Off below 2x, error at 5x and under 0.1/1k on the
# baseline, warning otherwise or under 10 combined hits. Unlisted checks stay error.
# Per-check rates live in the eval bucket at authoring/vale-gate/sweep.json.

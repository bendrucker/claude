name: Bun install
description: Set up Bun, restore the dependency cache, and install with a frozen lockfile

runs:
  using: composite
  steps:
    - name: Setup Bun
      id: setup-bun
      uses: oven-sh/setup-bun@v2
      with:
        # Pinned so a Bun release lands as a reviewable diff. Unpinned, CI
        # floats to the current release and a runtime behavior change arrives
        # as an unexplained red build on an untouched branch.
        bun-version: 1.4.2

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        # No restore-keys: a partial hit restores the old cache and saves it
        # back with the new packages added, so it grows with every lockfile.
        key: bun-${{ runner.os }}-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

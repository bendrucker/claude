schema_version: "1.1"
name: skill-003
tags: [holdout]
plugins: ["../../..", "../../../../pull-request", "../../../../issue"]
execution:
  model: claude-opus-5-5
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  append_system_prompt: >-
    This sandbox has no network and nobody answers mid-task. Write the change
    to the file in the repo. Then reply with the file's complete final
    contents inside <out> and </out> tags and nothing else.
context:
  scaffold_script: fixture.sh

name: Bun install
description: Set up Bun and install with a frozen lockfile

inputs:
  workspace:
    description: Install only the root and this workspace path with its nested workspaces, instead of every workspace
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        # Pinned so a Bun release lands as a reviewable diff. Unpinned, CI
        # floats to the current release and a runtime behavior change arrives
        # as an unexplained red build on an untouched branch.
        bun-version: 1.4.2

    # No dependency cache: restoring the ~900 MB store takes longer than
    # installing from the registry.
    - name: Install dependencies
      shell: bash
      env:
        WORKSPACE: ${{ inputs.workspace }}
      run: |
        if [[ -n "$WORKSPACE" ]]; then
          bun install --frozen-lockfile --filter ./ --filter "./$WORKSPACE" --filter "./$WORKSPACE/**"
        else
          bun install --frozen-lockfile
        fi

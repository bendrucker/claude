StylesPath = styles
MinAlertLevel = suggestion
Vocab = Writing

# Synced into styles/ on first lint, and again when this list changes.
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip, https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells-commits.zip

# Hook prose that is not a file: PR/issue/comment bodies and MCP text, and git messages.
[formats]
prbody = md
commitmsg = md
# A peer-review comment body: inline, general, or a review summary.
reviewbody = md

# Prose files, messages, and the comments of the languages Vale parses. Any other file matches no section, so Vale reports nothing on it.
[*.{md,markdown,mdx,txt,prbody,commitmsg,reviewbody,c,h,cc,cpp,hpp,cs,css,scss,go,java,kt,js,cjs,mjs,jsx,ts,cts,mts,tsx,py,rb,swift}]
BasedOnStyles = ai-tells, Writing

# Offers, greetings, and acknowledgments belong to a reply, not to a file's prose.
Writing.HedgingClose = NO
Writing.PermissionSeeking = NO
Writing.Salutation = NO
Writing.SycophanticAcknowledgment = NO
Writing.IUnderstand = NO

# Calibrated on review comments only.
Writing.CodeDensity = NO
Writing.HedgedSuggestion = NO

# Every ai-tells check runs at warning, except where a judged sample sets it otherwise.
# The package ships each check at error, which denies a message, so each one is listed.
# Each exception names the pattern its misses share. Re-level by judged precision per `.claude/rules/vale-styles.md`.
ai-tells.ColonUsage = NO  # a capital after a definition-list or field colon
ai-tells.DoubleHyphen = NO  # CLI flags, argument hints, regexes, and comment banners
ai-tells.FillerIntensifier = NO  # "a single" carrying a real count contrast
ai-tells.FormalRegister = NO  # "implementation" and similar technical nouns
ai-tells.FormalTransitions = NO  # "for example" and "therefore" in plain use
ai-tells.NegatedObject = NO  # a negated object that reads fine as written
ai-tells.NounString = NO  # possessive and compound technical noun phrases
ai-tells.VerbTricolon = NO  # literal three-item lists and action sequences
ai-tells.OverusedVocabulary = suggestion  # words quoted as patterns or terms rather than used
ai-tells.EmDashUsage = error  # an em dash joining clauses, which Writing.SpacedEmDash denied before it retired


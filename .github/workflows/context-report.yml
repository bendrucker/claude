name: Context Usage Report

on:
  push:
    paths:
      - '.claude/**'
      - '.github/workflows/context-report.yml'
  pull_request:
    paths:
      - '.claude/**'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Setup Claude configuration
        run: ./install.sh

      - name: Generate context report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p tmp
          claude --print '/context' --output-format json --verbose | ./scripts/context.sh check | tee tmp/context.json | ./scripts/context.sh report > tmp/context-report.md

      - name: Post to job summary
        run: |
          cat tmp/context-report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: context-report
          path: |
            tmp/context.json
            tmp/context-report.md

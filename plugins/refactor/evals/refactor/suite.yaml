allow_tools: [Bash, Edit, Write]
judge_model: claude-sonnet-5-5
collect: [package.json, bunfig.toml, README.md, bin, lib, src, legacy, harness, scripts, config, data, ops, vendor, corpus, test, tmp]
graders:
  skill-fired: ["port-*", "reach-*"]
  split-fired: "split-*"
  compared-both: "port-*"
  old-kept: "port-*"
  quiet: "quiet-*"
  ran-tests: ["split-*", "port-dedupe-*", "port-upstream-*"]

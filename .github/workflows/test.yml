name: test

on:
  pull_request: {}
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check marketplace completeness
        run: ./scripts/check-marketplace.sh

  json-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate settings.json
        uses: cardinalby/schema-validator-action@v3
        with:
          file: '.claude/settings.json'
          mode: lax

      - name: Validate marketplace.json
        uses: cardinalby/schema-validator-action@v3
        with:
          file: '.claude-plugin/marketplace.json'
          schema: 'schemas/marketplace.schema.json'

      - name: Validate plugin.json files
        uses: cardinalby/schema-validator-action@v3
        with:
          file: 'plugins/*/.claude-plugin/plugin.json'
          schema: 'schemas/plugin.schema.json'

  hooks:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_REPO_HOME: ${{ github.workspace }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Install ShellSpec
        run: curl -fsSL https://git.io/shellspec | sh -s -- --yes 0.28.1

      - name: Setup Claude configuration
        run: CLAUDE_REPO_HOME="$GITHUB_WORKSPACE" ./install.sh

      - name: Run hook tests
        run: shellspec --tag unit

  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          folder-path: '.claude/'
          file-path: './CLAUDE.md'

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate frontmatter
        run: npm run lint

  typescript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces

      - name: Build workspaces
        run: npm run build --workspaces

  context:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_REPO_HOME: ${{ github.workspace }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Setup Claude configuration
        run: CLAUDE_REPO_HOME="$GITHUB_WORKSPACE" ./install.sh

      - name: Generate context report
        run: |
          mkdir -p tmp
          echo '## Claude Code Context Usage' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          claude --print '/context' --output-format json --verbose | jq -r '.[1].message.content' | awk '/<local-command-stdout>/{flag=1;next}/<\/local-command-stdout>/{flag=0}flag' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

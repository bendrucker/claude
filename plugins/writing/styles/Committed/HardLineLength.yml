# `hard_line_length`: "Max number of columns any line can occupy", every
# line of the message and no exemption. Off by default, as committed's
# default of 0 is; the margin is the script's first line.
extends: script
message: "hard_line_length: this line runs past 100 from '%s'."
link: https://github.com/crate-ci/committed/blob/master/docs/reference.md
level: error
scope: raw
script: |
  max := 100
  text := import("text")
  matches := []
  pos := 0
  for line in text.split(scope, "\n") {
    next := pos + len(line) + 1
    if text.re_match(`^#\s*-+\s*>8\s*-+\s*$`, line) {
      break
    }
    if text.has_prefix(line, "#") {
      pos = next
      continue
    }
    over := text.re_find(`^.{` + string(max) + `}`, line)
    if over != undefined && over[0][0].end < len(line) {
      matches = append(matches, {begin: pos + over[0][0].end, end: pos + len(line)})
    }
    pos = next
  }

tests:
  - name: "url line counted"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      Add a thing

      See https://example.com/a/very/long/path/that/runs/on/and/on/and/on/past/one/hundred/columns/in/all for it.
    want: |
      3:101:Committed.HardLineLength:hard_line_length: this line runs past 100 from 'for it.'.
  - name: "clean"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      Add a thing

      A short body.
    want: ""

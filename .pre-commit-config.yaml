repos:
  - repo: local
    hooks:
      - id: plugin-test
        name: Plugin tests
        language: system
        files: ^plugins/
        entry: scripts/prek-check.sh plugin-test

      - id: plugin-validate
        name: Plugin validation
        language: system
        files: ^plugins/[^/]+/\.claude-plugin/plugin\.json$
        entry: scripts/prek-check.sh plugin-validate

      - id: hooks-validate
        name: Hooks validation
        language: system
        files: ^plugins/[^/]+/hooks/
        entry: scripts/prek-check.sh hooks-validate

      - id: skill-lint
        name: Skill lint
        language: system
        files: ^plugins/[^/]+/skills/
        entry: scripts/prek-check.sh skill-lint

      - id: skill-invocability
        name: Skill invocability
        language: system
        files: ^(plugins/[^/]+/skills/|user/skills/|\.claude/skills/)
        pass_filenames: false
        entry: bun scripts/check-skill-invocability.ts

      - id: hook-test
        name: Hook tests
        language: system
        files: ^(\.claude/hooks/|user/hooks/)
        pass_filenames: false
        entry: bun test .claude/hooks user/hooks

      - id: settings-validate
        name: Settings validation
        language: system
        files: ^(\.claude/settings\.json|user/settings\.json)$
        pass_filenames: false
        entry: bun packages/validate/settings.ts

      - id: lint
        name: Lint
        language: system
        files: \.ts$
        pass_filenames: false
        entry: bun run lint

      - id: marketplace-check
        name: Marketplace completeness
        language: system
        files: ^(plugins/|\.claude-plugin/marketplace\.json)
        pass_filenames: false
        entry: bun scripts/check-marketplace.ts

      - id: md-code
        name: Markdown embedded code
        language: system
        files: \.md$
        pass_filenames: false
        entry: bun scripts/check-md-code.ts

# evidence: none recorded; pre-dates the curation principle. Kept because the rhetorical "X, not Y" contrast is a consistent AI-prose tell.
# retire when: precision is low on a labeled corpus sample, or the pattern fires heavily on user text.
extends: existence
message: "'%s' is a rhetorical 'X, not Y' contrast. State the positive directly."
link: https://github.com/bendrucker/claude/blob/main/plugins/writing/styles/Writing/ContrastNot.yml
level: warning
ignorecase: true
nonword: true
exceptions:
  - ',\s+not\s+(?:necessarily|including|to\s+mention)\b'
tokens:
  - '\b\w[\w\s]{2,40},\s+not\s+\w[\w\s]{2,30}(?:[.!?,;:]|$)'
tests:
  - name: "flags a noun contrast after a copula"
    input: |
      This is a tool, not a framework.
    contains: [Writing.ContrastNot]
  - name: "flags an abstract noun contrast"
    input: |
      The goal is clarity, not perfection.
    contains: [Writing.ContrastNot]
  - name: "allows not without a comma"
    input: |
      It is not the case that X.
    absent: Writing.ContrastNot
  - name: "allows the not-but order"
    input: |
      Not a framework, but a tool.
    absent: Writing.ContrastNot
  - name: "allows the not-necessarily exception"
    input: |
      The cache is fast, not necessarily correct.
    absent: Writing.ContrastNot
  - name: "allows the not-including exception"
    input: |
      Ship the build, not including the docs.
    absent: Writing.ContrastNot

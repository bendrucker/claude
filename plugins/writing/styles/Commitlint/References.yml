# `references-empty` set to `never`: the message refers to an issue, `#123`,
# anywhere in it. Off by default. The message is read whole, so the
# reference counts wherever it sits -- and `raw` is the one scope the View
# does not filter, so the walk does the filtering instead: Git's own
# commentary is read past and the scissors line that `commit -v` puts before
# the diff ends the read. Otherwise a `#5` in the diff, or in a comment,
# satisfies the rule and a message with no reference of its own passes.
#
# A script rather than an `occurrence`, since the count has to be taken over
# the walk; the rule is commitlint's boolean, so there is no `min` to set.
extends: script
message: "Reference an issue somewhere in the message: '#123'."
link: https://commitlint.js.org/reference/rules.html#references-empty
level: error
scope: raw
script: |
  text := import("text")
  matches := []
  pos := 0
  found := false
  first := undefined
  for line in text.split(scope, "\n") {
    next := pos + len(line) + 1
    if text.re_match(`^#\s*-+\s*>8\s*-+\s*$`, line) {
      break
    }
    if text.has_prefix(line, "#") {
      pos = next
      continue
    }
    if text.re_match(`#\d+`, line) {
      found = true
    }
    if first == undefined {
      word := text.re_find(`\S+`, line)
      if word != undefined {
        first = {begin: pos + word[0][0].begin, end: pos + word[0][0].end}
      }
    }
    pos = next
  }
  if !found && first != undefined {
    matches = append(matches, first)
  }

tests:
  - name: "extras"
    about: "the rules config-conventional leaves off, most of them firing at once"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      fix(web)!: add URL parsing

      Short.
    want: |
      1:1:Commitlint.References:Reference an issue somewhere in the message: '#123'.
  - name: "extras-short"
    about: "a header under the minimum, no scope, no body, and the breaking footer without a '!'"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      fix: x

      BREAKING CHANGE: the flag is gone
      Signed-off-by: J <j@example.com>
    want: |
      1:1:Commitlint.References:Reference an issue somewhere in the message: '#123'.
  - name: "referenced"
    about: "a reference in the body is what the rule asks for"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      fix(web): add URL parsing

      The parser dropped the query string. Closes #123.
    want: ""
  - name: "git-lines"
    about: "a '#5' in the diff commit -v appends is not the author's reference"
    format: COMMIT_EDITMSG
    view: Commit
    input: "fix(web): add URL parsing\n\nThe parser dropped the query string.\n\n# Please enter the commit message for your changes.\n# ------------------------ >8 ------------------------\ndiff --git a/x.c b/x.c\n+int arr[#5];\n"
    want: |
      1:1:Commitlint.References:Reference an issue somewhere in the message: '#123'.

# The core is on by default: the rules every convention agrees on. Name a
# convention beside it in your own config to pick the shape of the message:
#
#   [COMMIT_EDITMSG]
#   BasedOnStyles = Commits, Conventional
#
# The View is what lets a rule reach the subject, the body, or a trailer by
# name. It applies to whatever this section matches, so a message read from
# stdin needs `--path=COMMIT_EDITMSG` to land here.
MinAlertLevel = suggestion

[COMMIT_EDITMSG]
BasedOnStyles = Commits
View = Commit

# Rules a tool leaves off by default are off here too: commitlint's beyond
# config-conventional, gitlint's contrib rule, committed's conventional
# style, and conform's optional blocks. Turn one on in your own section with
# `= YES`.
Commitlint.Scope = NO
Commitlint.ScopeRequired = NO
Commitlint.HeaderCase = NO
Commitlint.HeaderMinLength = NO
Commitlint.BodyMinLength = NO
Commitlint.References = NO
Commitlint.Trailer = NO
Commitlint.Exclamation = NO
Commitlint.BreakingBang = NO
Commitlint.Body = NO
Commitlint.BodyMaxLength = NO
Commitlint.FooterRequired = NO
Commitlint.FooterMaxLength = NO
Commitlint.ScopeCase = NO
Commitlint.SubjectLength = NO
Commitlint.ScopeLength = NO
Commitlint.ScopeDelimiter = NO
Commitlint.TypeLength = NO
Commitlint.BodyCase = NO
Commitlint.BodyFullStop = NO
Gitlint.DisallowCleanupCommits = NO
Gitlint.TitleMatchRegex = NO
Gitlint.BodyMatchRegex = NO
Committed.Type = NO
Committed.HardLineLength = NO
Committed.DescriptionCapitalized = NO
Conform.Jira = NO
Conform.DescriptionLength = NO

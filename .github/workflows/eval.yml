name: eval

# CI runs use tracked fixtures only (each harness's fixtures/ materialized from
# in-repo skill sources plus its scenarios/). S3 corpora never reach this
# workflow. Harnesses live at plugins/<plugin>/evals/<suite>.

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run
        type: choice
        options: [pr-body, pr-create]
        default: pr-body
      args:
        description: Extra claude plugin eval arguments for pr-create, such as --runs 1 --case plan-deviations
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Manual dispatch runs the chosen suite. A PR run additionally needs
    # the `eval` label, since these are live model calls against a budget.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'eval')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      suites: ${{ steps.filter.outputs.changes || steps.all.outputs.suites }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Filter keys are promptfoo suite names. Each needs an entry in the eval
      # job's SUITE_DIR map and in the workflow_dispatch options.
      - name: Detect touched suites
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            pr-body:
              - 'plugins/pull-request/**'

      # The native pr-create suite runs in its own job, so it never joins the
      # promptfoo matrix.
      - name: Select dispatched suite
        if: github.event_name == 'workflow_dispatch'
        id: all
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          if [ "$SUITE" = pr-create ]; then
            echo 'suites=[]' >> "$GITHUB_OUTPUT"
          else
            jq -cn --arg suite "$SUITE" '"suites=\([$suite])"' -r >> "$GITHUB_OUTPUT"
          fi

  eval:
    needs: changes
    if: needs.changes.outputs.suites != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.changes.outputs.suites) }}
    env:
      PROMPTFOO_CONFIG_DIR: ${{ github.workspace }}/.promptfoo
      SUITE_DIR: ${{ fromJson('{"pr-body":"plugins/pull-request/evals/pr-body"}')[matrix.suite] }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: ./.github/actions/bun-install

      - name: Resolve suite directory
        run: |
          if [ -z "$SUITE_DIR" ]; then
            echo "::error::No SUITE_DIR mapping for suite '${{ matrix.suite }}'. Add it to the eval job's env map."
            exit 1
          fi

      # A suite with generated cases declares a `cases` script. Generated cases
      # drift silently, and the check costs nothing and runs ahead of the
      # credential gate, so drift fails the job before a single model call is billed.
      - name: Check eval cases
        working-directory: ${{ env.SUITE_DIR }}
        run: |
          set -euo pipefail
          if jq -e '.scripts.cases' package.json > /dev/null 2>&1; then
            bun run cases --check
          fi

      - name: Check for eval credentials
        id: check
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice
        if: steps.check.outputs.has_key == 'false'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set, so the ${{ matrix.suite }} eval is skipped. Add the secret (from 'claude setup-token') to enable live runs."

      # A suite whose providers point at a fixture tree declares a `fixtures`
      # script. The tree is git-ignored, so the run materializes it here,
      # ahead of the credential steps: the script runs with no token in the
      # environment and no credentials file on disk.
      - name: Materialize fixtures
        if: steps.check.outputs.has_key == 'true'
        working-directory: ${{ env.SUITE_DIR }}
        run: |
          set -euo pipefail
          if jq -e '.scripts.fixtures' package.json > /dev/null 2>&1; then
            bun run fixtures
          fi

      # The spawned CLI reads the token from the environment. promptfoo's grader
      # providers only read it from ~/.claude/.credentials.json on Linux.
      - name: Write grader credentials
        if: steps.check.outputs.has_key == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.claude"
          jq -n --arg token "$CLAUDE_CODE_OAUTH_TOKEN" '{claudeAiOauth: {accessToken: $token}}' > "$HOME/.claude/.credentials.json"
          chmod 600 "$HOME/.claude/.credentials.json"

      # `continue-on-error` lets a failing eval still upload, summarize, and
      # comment before the last step turns the job red.
      - name: Run promptfoo eval
        if: steps.check.outputs.has_key == 'true'
        id: eval
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        working-directory: ${{ env.SUITE_DIR }}
        run: bunx promptfoo eval --no-progress-bar -o output.json

      - name: Upload results
        if: steps.eval.outcome != 'skipped' && hashFiles(format('{0}/output.json', env.SUITE_DIR)) != ''
        uses: actions/upload-artifact@v7
        with:
          name: promptfoo-${{ matrix.suite }}-${{ github.run_id }}
          path: ${{ env.SUITE_DIR }}/output.json

      - name: Summarize results
        if: steps.eval.outcome != 'skipped' && hashFiles(format('{0}/output.json', env.SUITE_DIR)) != ''
        id: summary
        working-directory: ${{ env.SUITE_DIR }}
        run: |
          set -euo pipefail
          successes=$(jq '.results.stats.successes // 0' output.json)
          failures=$(jq '.results.stats.failures // 0' output.json)
          errors=$(jq '.results.stats.errors // 0' output.json)
          total=$((successes + failures + errors))
          pass_rate=$(awk -v s="$successes" -v t="$total" 'BEGIN { printf (t > 0) ? "%.1f" : "0.0", (t > 0 ? s / t * 100 : 0) }')
          total_cost=$(jq '([.results.results[]?.cost // 0] | add // 0) * 100 | round / 100' output.json)
          {
            echo "pass_rate=$pass_rate"
            echo "total_cost=$total_cost"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## promptfoo eval: ${{ matrix.suite }}"
            echo ""
            echo "pass rate: ${pass_rate}% ($successes/$total) · total cost: \$${total_cost}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update PR comment
        if: steps.summary.outcome == 'success' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE: ${{ matrix.suite }}
          PASS_RATE: ${{ steps.summary.outputs.pass_rate }}
          TOTAL_COST: ${{ steps.summary.outputs.total_cost }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="<!-- promptfoo-eval:${SUITE} -->"
          body=$(cat <<BODY
          ${marker}
          ### promptfoo eval: \`${SUITE}\`

          | metric | value |
          | --- | --- |
          | pass rate | ${PASS_RATE}% |
          | total cost | \$${TOTAL_COST} |

          [Full run](${RUN_URL})
          BODY
          )
          existing_id=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n1)
          if [ -n "$existing_id" ]; then
            gh api "repos/${REPO}/issues/comments/${existing_id}" -X PATCH -f body="$body"
          else
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" -X POST -f body="$body"
          fi

      - name: Surface eval failure
        if: steps.eval.outcome == 'failure'
        run: exit 1

  # The native claude plugin eval suite for pull-request:create. Dispatch
  # only while its loop settles, since one run is 6 cases x 3 runs x 2 arms
  # plus a 3-vote judge per llm grader.
  native:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'pr-create'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SUITE_DIR: plugins/pull-request/evals/create
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for eval credentials
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Add the secret (from 'claude setup-token') to run the pr-create eval."
            exit 1
          fi

      # The runner confines each agent's shell tools with bubblewrap, and
      # Ubuntu 24.04's AppArmor policy blocks the unprivileged user namespaces
      # it needs.
      - name: Install Claude Code
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm install -g @anthropic-ai/claude-code@2.1.280

      - name: Write credentials
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.claude"
          jq -n --arg token "$CLAUDE_CODE_OAUTH_TOKEN" '{claudeAiOauth: {accessToken: $token}}' > "$HOME/.claude/.credentials.json"
          chmod 600 "$HOME/.claude/.credentials.json"

      # --threshold 0 leaves the exit code to runner errors. Scores are read
      # from result.json, where a case below 1.0 is the normal state.
      - name: Run eval
        id: eval
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ARGS: ${{ inputs.args }}
        run: |
          # shellcheck disable=SC2086
          "$SUITE_DIR/run.sh" --no-publish --threshold 0 --concurrency 4 $ARGS

      - name: Upload results
        if: steps.eval.outcome != 'skipped' && hashFiles(format('{0}/results/*/result.json', env.SUITE_DIR)) != ''
        uses: actions/upload-artifact@v7
        with:
          name: pr-create-${{ github.run_id }}
          path: ${{ env.SUITE_DIR }}/results/

      - name: Summarize results
        if: steps.eval.outcome != 'skipped' && hashFiles(format('{0}/results/*/result.json', env.SUITE_DIR)) != ''
        run: |
          set -euo pipefail
          results=("$SUITE_DIR"/results/*/result.json)
          result=${results[-1]}
          jq -r '
            def pct: if . == null then "–" else (. * 100 | round | tostring) + "%" end;
            "## claude plugin eval: pr-create",
            "",
            "score \(.aggregates.overallScore | pct) · mean delta \(.aggregates.meanDelta | pct) · cost $\(.costUsd * 100 | round / 100)",
            "",
            "| case | with | without | delta |",
            "| --- | --- | --- | --- |",
            (.cases[] | "| \(.name) | \(.aggregates.score | pct) | \(.aggregates.scoreWithout | pct) | \(.aggregates.delta | pct) |")
          ' "$result" >> "$GITHUB_STEP_SUMMARY"

      - name: Surface eval failure
        if: steps.eval.outcome == 'failure'
        run: exit 1

schema_version: "1.1"
name: bug-upstream-empty-element
tags: [bug, compact, upstream, dev]
plugins: ["../../..", "../../../../pull-request"]
execution:
  model: claude-sonnet-5-5
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Write]
  append_system_prompt: >-
    No repository or tracker is reachable. Treat the files and links in the
    prompt as what you found investigating. The issue goes to the GitHub
    issue tracker of github.com/example/xml-reader, a project our team uses
    but does not maintain. No user will answer questions or approve a draft.
    Reply with the finished issue, frontmatter and body, between a line
    holding only <issue> and a line holding only </issue>.

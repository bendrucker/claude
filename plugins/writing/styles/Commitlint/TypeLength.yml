# `type-max-length` and `type-min-length`: the type's characters. A type is
# a word from a list, so the list bounds it; this is for a project without
# one. Off by default; `Commitlint.TypeLength[max] = 8` and `[min] = 3` set
# the counts, and `min` is unset until asked for.
extends: occurrence
message: "A type of %d characters, outside type-min-length and type-max-length."
link: https://commitlint.js.org/reference/rules.html#type-max-length
level: error
scope: subject
token: '(?<=^\w*)\w(?=\w*(?:\([^()]*\))?!?:)'
max: 72
min: 0
tests:
  - name: "long"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      averyveryveryveryveryveryveryveryveryveryveryveryveryveryveryveryverylongtype: add a thing
    want: |
      1:1:Commitlint.TypeLength:A type of 77 characters, outside type-min-length and type-max-length.
  - name: "clean"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      fix: add a thing
    want: ""

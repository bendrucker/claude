schema_version: "1.1"
name: gitlab-baseline
tags: [dev]
plugins: ["../../..", "../../../../gitlab"]
execution:
  model: claude-sonnet-5-5
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent]
  append_system_prompt: >-
    This sandbox has no network. The gh and glab CLIs answer from a read-only
    snapshot of the review and refuse any write. Nobody answers while you work,
    so finish the assessment in one reply and stop before posting, approving, or
    resolving anything.
context:
  scaffold_script: fixture.sh

name: test

on:
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: mcps
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcps/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run type-check

  install:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcps/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mcps

      - name: Run install script
        run: ./install.sh

  tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcps
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcps/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate configuration
        run: npx tsx cli.ts validate

      - name: Install uv and uvx
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          # Verify uvx is available
          $HOME/.cargo/bin/uvx --version || echo "uvx not found, using uv tool run"

      - name: Run tools command
        run: npm run tools -- --exclude github

  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          folder-path: '.claude/'
          file-path: './CLAUDE.md'

name: Evaluate Claude Configuration

on:
  pull_request:
    paths:
      - '.claude/**'
      - 'CLAUDE.md'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/eval.yml'

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run type-check

  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run evaluation
        run: npm run eval run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}


  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run install
        run: ./install.sh

      - name: Validate JSON files
        run: |
          for file in .claude/*.json; do
            if [ -f "$file" ]; then
              echo "Validating $file"
              jq . "$file" > /dev/null || exit 1
            fi
          done

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          folder-path: '.claude/'
          file-path: './CLAUDE.md'

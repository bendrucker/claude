# `scope-max-length` and `scope-min-length`: the scope's characters, counted
# by an occurrence of one character at a time inside the parentheses. Off by
# default; `Commitlint.ScopeLength[max] = 20` and `[min] = 2` set the counts,
# and `min` is unset until asked for: a commit with no scope has none to
# count, and commitlint skips it.
extends: occurrence
message: "A scope of %d characters, outside scope-min-length and scope-max-length."
link: https://commitlint.js.org/reference/rules.html#scope-max-length
level: error
scope: subject
token: '(?<=^\w+\([^()]*)[^()]'
max: 72
min: 0
tests:
  - name: "long"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      fix(a scope that runs on past the seventy-two characters allowed for one, and then some more): add a thing
    want: |
      1:5:Commitlint.ScopeLength:A scope of 88 characters, outside scope-min-length and scope-max-length.
  - name: "clean"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      fix(parser): add a thing
    want: ""

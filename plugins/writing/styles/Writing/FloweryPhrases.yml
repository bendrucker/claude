# evidence: flowery-phrases.txt entries were audited on the deliverable surface against the model corpus and the voice baseline.
# retire when: an entry is dead on the deliverable surface or not distinctive versus the voice baseline. Remove that entry.
extends: existence
message: "'%s' is stock phrasing the model reaches for. State the mechanism plainly."
level: error
ignorecase: true
tokens:
  - '\bsources?[\s-]+of[\s-]+truths?\b'
  - '\bescape[\s-]+hatch(?:es)?\b'
  - '\bself[\s-]+(?:sufficient|sufficiency)\b'
  - '\b(?:fail|fails|failed|failing)[\s-]+loud(?:ly)?\b'
tests:
  - name: "flags This keeps a single source of truth."
    input: |
      This keeps a single source of truth.
    contains: [Writing.FloweryPhrases]
  - name: "flags Added an escape hatch for power users."
    input: |
      Added an escape hatch for power users.
    contains: [Writing.FloweryPhrases]
  - name: "flags The tool is self-sufficient."
    input: |
      The tool is self-sufficient.
    contains: [Writing.FloweryPhrases]
  - name: "flags It should fail loudly on bad input."
    input: |
      It should fail loudly on bad input.
    contains: [Writing.FloweryPhrases]
  - name: "allows The truth about the data source is unclear."
    input: |
      The truth about the data source is unclear.
    absent: Writing.FloweryPhrases
  - name: "allows A hatch you can escape through."
    input: |
      A hatch you can escape through.
    absent: Writing.FloweryPhrases

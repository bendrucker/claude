schema_version: "1.1"
name: docsync
tags: [frame]
plugins: ["../../.."]
execution:
  model: claude-sonnet-5-5
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  append_system_prompt: >-
    You were dispatched to work unattended. No user will answer questions in
    this session, and nothing can be built or run. Stop at the end of the
    Frame: write the climb notes file, bench/CLIMB.md, with its Rules section
    and a Checkpoint section holding your plan for the baseline and the first
    candidates. Then reply with a short report.
context:
  scaffold_script: fixture.sh

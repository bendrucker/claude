# `header-case` set to `lower-case`: the whole header, as commitlint compares
# it, so `URL` in a subject fails as it does there. Off by default.
extends: existence
message: "header-case is lower-case: '%s'."
link: https://commitlint.js.org/reference/rules.html#header-case
level: error
scope: subject
nonword: true
raw:
  - '[A-Z]+'

tests:
  - name: "extras"
    about: "the rules config-conventional leaves off, most of them firing at once"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      fix(web)!: add URL parsing

      Short.
    want: |
      1:16:Commitlint.HeaderCase:header-case is lower-case: 'URL'.
  - name: "extras-lengths"
    about: "a capitalized scope, and a description, a body, and footers past the whole-part limits"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      fix(Web)!: a description that runs on past the seventy-two characters the default allows for it

      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand. See #1.

      Reviewed-by: Reviewer Number 01 <reviewer01@example.com>

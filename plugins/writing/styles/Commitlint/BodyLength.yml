# `body-max-line-length`: 100 characters a line, and a line that holds a
# URL is exempt, as it is in commitlint. The script is the shared one,
# Commits/_shared/Wrap.yml, with its margin at 100; a script is one value,
# so a different margin means the whole of it.
extends: Commits._shared.Wrap
message: "A body line runs past 100 characters from '%s'."
link: https://github.com/conventional-changelog/commitlint/tree/master/%40commitlint/config-conventional#body-max-line-length
level: error
script: |
  max := 100
  text := import("text")
  matches := []
  pos := 0
  seen_subject := false
  para_start := true
  in_trailers := false
  for line in text.split(scope, "\n") {
    next := pos + len(line) + 1
    if text.re_match(`^#\s*-+\s*>8\s*-+\s*$`, line) {
      break
    }
    if text.has_prefix(line, "#") {
      pos = next
      continue
    }
    if text.trim_space(line) == "" {
      para_start = true
      in_trailers = false
      pos = next
      continue
    }
    if !seen_subject {
      seen_subject = true
      pos = next
      continue
    }
    if para_start && text.re_match(`^(?i:breaking[ -]change|[\w-]+)(?:: | #)`, line) {
      in_trailers = true
    }
    para_start = false
    if !in_trailers && !text.re_match(`https?://`, line) {
      over := text.re_find(`^.{` + string(max) + `}`, line)
      if over != undefined && over[0][0].end < len(line) {
        matches = append(matches, {begin: pos + over[0][0].end, end: pos + len(line)})
      }
    }
    pos = next
  }

tests:
  - name: "before"
    about: "capitalized type and subject, a period, and three lines past 100; the URL line is exempt"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      Chore(Deps): Bump the lodash dependency to the latest release, which closes several security advisories at once.

      The body of this message has a line that is longer than one hundred characters, which commitlint reports.
      See https://github.com/conventional-changelog/commitlint/tree/master/%40commitlint/config-conventional#body-max-line-length for it.

      BREAKING CHANGE: a footer line that is also longer than one hundred characters, which the footer rule reports.
    want: |
      3:101:Commitlint.BodyLength:A body line runs past 100 characters from 'orts.'.
  - name: "after"
    about: "the rewrite"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      chore(deps): bump lodash to the latest release

      The body wraps at one hundred characters, and a line that holds a URL is exempt:
      https://github.com/conventional-changelog/commitlint/tree/master/%40commitlint/config-conventional#body-max-line-length

      BREAKING CHANGE: the lockfile format changed.
    want: ""
  - name: "guards"
    about: "an acronym and a name are not capitalized words"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      fix: URL parsing keeps the fragment

      Two words in capitals do not make an upper-case subject, and a name
      such as HttpClient is not a capitalized word.
    want: ""

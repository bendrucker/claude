<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Page border -->
  <rect width="600" height="400" fill="white" stroke="black" stroke-dasharray="4"/>

  <!-- Header -->
  <g transform="translate(0,0)">
    <rect width="600" height="48" fill="none" stroke="black" stroke-dasharray="4"/>
    <text font-family="sans-serif" x="20" y="30" font-size="16" fill="black">Profile Page</text>
  </g>

  <!-- Profile section -->
  <g transform="translate(20,68)">
    <!-- Avatar placeholder -->
    <g transform="translate(0,0)">
      <rect width="100" height="100" fill="none" stroke="black"/>
      <line x1="0" y1="0" x2="100" y2="100" stroke="black"/>
      <line x1="100" y1="0" x2="0" y2="100" stroke="black"/>
    </g>

    <!-- Profile info -->
    <g transform="translate(120,0)">
      <text font-family="sans-serif" x="0" y="20" font-size="18" fill="black">User Name</text>
      <text font-family="sans-serif" x="0" y="44" font-size="12" fill="black">user@example.com</text>
      <text font-family="sans-serif" x="0" y="64" font-size="12" fill="black">Member since 2024</text>
    </g>
  </g>

  <!-- Content section -->
  <g transform="translate(20,188)">
    <rect width="560" height="180" fill="none" stroke="black" stroke-dasharray="4"/>

    <!-- Section title -->
    <text font-family="sans-serif" x="16" y="28" font-size="14" fill="black">Recent Activity</text>

    <!-- Lorem text lines -->
    <g transform="translate(16,48)">
      <line x1="0" y1="0" x2="400" y2="0" stroke="black"/>
      <line x1="0" y1="20" x2="380" y2="20" stroke="black"/>
      <line x1="0" y1="40" x2="420" y2="40" stroke="black"/>
      <line x1="0" y1="60" x2="200" y2="60" stroke="black"/>
    </g>
  </g>
</svg>

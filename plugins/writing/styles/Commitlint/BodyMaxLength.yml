# `body-max-length`: the body as a whole has at most `max` characters, as
# against `body-max-line-length` for a line. Off by default;
# `Commitlint.BodyMaxLength[max] = 500` sets the count.
extends: occurrence
message: "A body of %d characters, past body-max-length."
link: https://commitlint.js.org/reference/rules.html#body-max-length
level: error
scope: body
token: '.'
max: 1000

tests:
  - name: "extras-lengths"
    about: "a capitalized scope, and a description, a body, and footers past the whole-part limits"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      fix(Web)!: a description that runs on past the seventy-two characters the default allows for it

      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand.
      A body line of sixty characters, repeated to pass a thousand. See #1.

      Reviewed-by: Reviewer Number 01 <reviewer01@example.com>

# evidence: assistant-written comments open by addressing the reader with a greeting or a name before the substance, which no published comment in the hand-written baseline does.
# A bare "Name," opener is not matched. Most of its corpus hits were openers like "Implemented,".
# retire when: openings that address a person stop appearing in assistant output.
extends: existence
message: "'%s' opens with a salutation. Nothing published addresses a person, by name or greeting. Delete the address and open on the substance."
link: https://github.com/bendrucker/claude/blob/main/plugins/writing/styles/Writing/Salutation.yml
level: warning
scope: raw
nonword: true
tokens:
  # A greeting at the start of the document, past any headings, with the rest of its line.
  - '\A(?:#[^\n]*\n\s*)*(?i:hi|hey|hello|dear|greetings|good\s+(?:morning|afternoon|evening))(?:[\s,!.:]|$)[^\n]{0,30}(?=\s|$)'
tests:
  - name: negative bare name before a comma
    about: bare name before a comma, given up with the name branch
    input: |
      Dana, this fires for the entire run rather than the changed files.
    want: ""
  - name: positive greeting word and name
    about: greeting word and name
    input: |
      Hi Dana,

      The retry loop swallows the error.
    want: |
      1:1:Writing.Salutation:'Hi Dana,' opens with a salutation. Nothing published addresses a person, by name or greeting. Delete the address and open on the substance.
  - name: positive greeting without a name
    about: greeting without a name
    input: |
      Hey there,

      A few notes below.
    want: |
      1:1:Writing.Salutation:'Hey there,' opens with a salutation. Nothing published addresses a person, by name or greeting. Delete the address and open on the substance.
  - name: positive greeting to a group
    about: greeting to a group
    input: |
      Hello team, a few notes below.
    want: |
      1:1:Writing.Salutation:'Hello team, a few notes below.' opens with a salutation. Nothing published addresses a person, by name or greeting. Delete the address and open on the substance.
  - name: positive formal greeting
    about: formal greeting
    input: |
      Dear reviewer,

      A few notes below.
    want: |
      1:1:Writing.Salutation:'Dear reviewer,' opens with a salutation. Nothing published addresses a person, by name or greeting. Delete the address and open on the substance.
  - name: positive greeting after a heading
    about: greeting after a heading
    input: |
      ## Review

      Hi Dana, the retry loop swallows the error.
    want: |
      1:1:Writing.Salutation:'## Review Hi Dana, the retry loop swallows' opens with a salutation. Nothing published addresses a person, by name or greeting. Delete the address and open on the substance.
  - name: negative connective opener
    about: connective opener
    input: |
      Otherwise, this looks right.
    want: ""
  - name: negative prepositional opener
    about: prepositional opener
    input: |
      Given the constraint, the second pass is redundant.
    want: ""
  - name: negative review idiom
    about: review idiom
    input: |
      Nit, but the constant belongs next to its only caller.
    want: ""
  - name: negative adverb opener
    about: adverb opener
    input: |
      Ideally, the retry budget comes from config.
    want: ""
  - name: negative gerund opener
    about: gerund opener
    input: |
      Naming, formatting, and tests all read fine.
    want: ""
  - name: negative agreement opener
    about: agreement opener
    input: |
      Agreed, the second pass is redundant.
    want: ""
  - name: negative time opener
    about: time opener
    input: |
      Today, the sweep still walks every file.
    want: ""
  - name: negative address after the opening line
    about: address after the opening line
    input: |
      The sweep is too broad.

      Dana, it fires on every run.
    want: ""
  - name: negative name inside a sentence
    about: name inside a sentence
    input: |
      The retry loop swallows the error Dana, who wrote it, described.
    want: ""
  - name: negative plain statement
    about: plain statement
    input: |
      The retry loop swallows the error.
    want: ""

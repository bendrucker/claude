# `body-min-length`: the body, when there is one, has at least `min`
# characters, counted over the whole body and not a paragraph at a time. A
# missing body is `body-empty`'s to report, as it is in commitlint. Off by
# default; the count is the script's first line, and the walk is the shared
# Wrap rule's: past Git's lines, stopping at the scissors, and leaving the
# trailer blocks out.
extends: script
message: "A body of %d characters, under body-min-length."
link: https://commitlint.js.org/reference/rules.html#body-min-length
level: error
scope: raw
script: |
  min := 20
  text := import("text")
  matches := []
  pos := 0
  seen_subject := false
  para_start := true
  in_trailers := false
  n := 0
  first := -1
  first_end := 0
  for line in text.split(scope, "\n") {
    next := pos + len(line) + 1
    if text.re_match(`^#\s*-+\s*>8\s*-+\s*$`, line) {
      break
    }
    if text.has_prefix(line, "#") {
      pos = next
      continue
    }
    if text.trim_space(line) == "" {
      para_start = true
      in_trailers = false
      pos = next
      continue
    }
    if !seen_subject {
      seen_subject = true
      pos = next
      continue
    }
    if para_start && text.re_match(`^(?i:breaking[ -]change|[\w-]+)(?:: | #)`, line) {
      in_trailers = true
    }
    para_start = false
    if !in_trailers {
      if first < 0 {
        first = pos
        first_end = pos + len(line)
      }
      for ch in line {
        n++
      }
    }
    pos = next
  }
  if first >= 0 && n < min {
    matches = append(matches, {begin: first, end: first_end, message: text.replace("A body of %d characters, under body-min-length.", "%d", string(n), 1)})
  }

tests:
  - name: "short body"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      fix: add a thing

      Short.

      Fixes #12
    want: |
      3:1:Commitlint.BodyMinLength:A body of 6 characters, under body-min-length.
  - name: "extras"
    about: "the rules config-conventional leaves off, most of them firing at once"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      fix(web)!: add URL parsing

      Short.
    want: |
      3:1:Commitlint.BodyMinLength:A body of 6 characters, under body-min-length.
  - name: "extras-short"
    about: "a header under the minimum, no scope, no body, and the breaking footer without a '!'"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      fix: x

      BREAKING CHANGE: the flag is gone
      Signed-off-by: J <j@example.com>
    want: ""
  - name: "after"
    about: "the rewrite"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      chore(deps): bump lodash to the latest release

      The body wraps at one hundred characters, and a line that holds a URL is exempt:
      https://github.com/conventional-changelog/commitlint/tree/master/%40commitlint/config-conventional#body-max-line-length

      BREAKING CHANGE: the lockfile format changed.
    want: ""
  - name: "guards"
    about: "an acronym and a name are not capitalized words"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      fix: URL parsing keeps the fragment

      Two words in capitals do not make an upper-case subject, and a name
      such as HttpClient is not a capitalized word.
    want: ""

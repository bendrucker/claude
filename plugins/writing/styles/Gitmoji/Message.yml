# "<intention> [scope?][:?] <message>": the message is "a brief explanation
# of the change", and it is not optional. Generated by script/gitmoji.py.
extends: existence
message: "A message follows the intention: what the change does."
link: https://gitmoji.dev/specification
level: error
scope: subject
nonword: true
raw:
  - '^(?:🎨|:art:|⚡|:zap:|🔥|:fire:|🐛|:bug:|🚑|:ambulance:|✨|:sparkles:|📝|:memo:|🚀|:rocket:|💄|:lipstick:|🎉|:tada:|✅|:white_check_mark:|🔒|:lock:|🔐|:closed_lock_with_key:|🔖|:bookmark:|🚨|:rotating_light:|🚧|:construction:|💚|:green_heart:|⬇|:arrow_down:|⬆|:arrow_up:|📌|:pushpin:|👷|:construction_worker:|📈|:chart_with_upwards_trend:|♻|:recycle:|➕|:heavy_plus_sign:|➖|:heavy_minus_sign:|🔧|:wrench:|🔨|:hammer:|🌐|:globe_with_meridians:|✏|:pencil2:|💩|:poop:|⏪|:rewind:|🔀|:twisted_rightwards_arrows:|📦|:package:|👽|:alien:|🚚|:truck:|📄|:page_facing_up:|💥|:boom:|🍱|:bento:|♿|:wheelchair:|💡|:bulb:|🍻|:beers:|💬|:speech_balloon:|🗃|:card_file_box:|🔊|:loud_sound:|🔇|:mute:|👥|:busts_in_silhouette:|🚸|:children_crossing:|🏗|:building_construction:|📱|:iphone:|🤡|:clown_face:|🥚|:egg:|🙈|:see_no_evil:|📸|:camera_flash:|⚗|:alembic:|🔍|:mag:|🏷|:label:|🌱|:seedling:|🚩|:triangular_flag_on_post:|🥅|:goal_net:|💫|:dizzy:|🗑|:wastebasket:|🛂|:passport_control:|🩹|:adhesive_bandage:|🧐|:monocle_face:|⚰|:coffin:|🧪|:test_tube:|👔|:necktie:|🩺|:stethoscope:|🧱|:bricks:|🧑‍💻|:technologist:|💸|:money_with_wings:|🧵|:thread:|🦺|:safety_vest:|✈|:airplane:|🦖|:t-rex:)\x{FE0F}?\s*(?:\([^()]*\))?:?\s*$'

tests:
  - name: "message"
    about: "an intention and a scope with no message"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      ✨ (components):
    want: |
      1:1:Gitmoji.Message:A message follows the intention: what the change does.
  - name: "after"
    about: "the rewrite"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      ♻️ (components): Transform classes to hooks
    want: ""
  - name: "guards"
    about: "the shortcode form"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      :recycle: Transform classes to hooks
    want: ""
  - name: "guards-zwj"
    about: "an emoji built from a joiner sequence"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      🧑‍💻 Improve developer experience
    want: ""

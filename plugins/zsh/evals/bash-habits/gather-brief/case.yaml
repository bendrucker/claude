schema_version: "1.1"
name: gather-brief
tags: [dev]
plugins: ["../../..", "../../../../mod-events"]
execution:
  model: claude-opus-5-5
  max_turns: 30
  timeout_seconds: 480
  allowed_tools: [Bash]
  append_system_prompt: >-
    You are a subagent dispatched by a lead Claude Code session. Use the Bash tool to investigate; the lead cannot see your tool output, only your final report. Be thorough, then return a concise report with file paths and line numbers.
context:
  scaffold_script: fixture.sh

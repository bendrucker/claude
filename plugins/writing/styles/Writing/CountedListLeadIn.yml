# evidence: a count in a list lead-in restates what the list shows and goes stale when an item changes. Counts of three and up run 37/M in assistant text against 4.7/M in the user's pre-AI writing.
# retire when: the assistant rate for counts of three and up falls to the voice baseline, or a labeling pass shows most hits are not list lead-ins.
extends: script
message: "A count in the lead-in repeats what the list shows. Drop the number: 'keeps:' rather than 'keeps six:'."
level: warning
scope: raw
script: |
  text := import("text")
  matches := []
  numbers := {three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12}

  lines := text.split(scope, "\n")
  starts := []
  eff := []
  pos := 0
  fenced := false
  for _, line in lines {
    starts = append(starts, pos)
    pos += len(line) + 1
    if text.re_match(`^\s*(\x60{3}|~{3})`, line) {
      fenced = !fenced
      eff = append(eff, "")
    } else if fenced {
      eff = append(eff, "")
    } else {
      masked := line
      for _, span in text.re_find(`\x60[^\x60]*\x60`, line, -1) {
        masked = text.replace(masked, span[0].text, text.repeat("_", len(span[0].text)), 1)
      }
      eff = append(eff, masked)
    }
  }

  inline_items := func(rest) {
    sentence := rest
    stop := text.re_find(`[.!?](\s|$)`, rest)
    if stop != undefined { sentence = rest[:stop[0][0].begin] }
    sentence = text.re_replace(`\([^)]*\)`, sentence, "")
    parts := []
    for _, p in text.split(text.replace(sentence, ";", ",", -1), ",") {
      if p != "" { parts = append(parts, p) }
    }
    for i := 1; i < len(parts); i++ {
      if text.re_match(`^\s*(and|or)\b`, parts[i]) { return i + 1 }
    }
    if len(parts) > 0 && text.re_match(`\b(and|or)\b`, parts[len(parts) - 1]) { return len(parts) + 1 }
    return len(parts)
  }

  block_items := func(at) {
    first := at
    for first < len(eff) && text.trim_space(eff[first]) == "" { first++ }
    if first >= len(eff) { return 0 }
    head := text.re_find(`^([ \t]*)([-*+]|\d+[.)])[ \t]`, eff[first])
    if head == undefined { return 0 }
    indent := head[0][1].text
    count := 0
    for i := first; i < len(eff); i++ {
      line := eff[i]
      if text.trim_space(line) == "" { continue }
      marker := text.re_find(`^([ \t]*)([-*+]|\d+[.)])[ \t]`, line)
      if marker != undefined && marker[0][1].text == indent {
        count++
      } else if marker == undefined && !text.has_prefix(line, indent + " ") && !text.has_prefix(line, indent + "\t") {
        break
      }
    }
    return count
  }

  for i := 0; i < len(eff); i++ {
    line := eff[i]
    leads := text.re_find(`[^.!?:]*:(\s|$)`, line, -1)
    if leads == undefined { continue }
    for _, found in leads {
      lead := found[0]
      colon := lead.end
      if !text.has_suffix(lead.text, ":") { colon = lead.end - 1 }
      body := line[lead.begin:colon - 1]
      words := text.re_find(`\S+`, body, -1)
      if words == undefined || len(words) < 2 { continue }
      rest := line[colon:]
      items := 0
      if text.trim_space(rest) != "" { items = inline_items(rest) } else { items = block_items(i + 1) }
      if items < 3 { continue }
      cards := text.re_find(`(?i)\b(three|four|five|six|seven|eight|nine|ten|eleven|twelve|[3-9]|1\d|20)\b`, body, -1)
      if cards == undefined { continue }
      for _, card in cards {
        found_at := card[0].begin
        found_end := card[0].end
        word := text.to_lower(card[0].text)
        value := 0
        if !is_undefined(numbers[word]) { value = numbers[word] } else { value = text.atoi(word) }
        if value != items { continue }
        if found_at > 0 && text.re_match(`[.\d%]`, body[found_at - 1:found_at]) { continue }
        if found_end < len(body) && text.re_match(`^[%.\d]`, body[found_end:found_end + 1]) { continue }
        before := text.trim_right(body[:found_at], " \t")
        previous := text.re_find(`\S+$`, before)
        start := found_at
        if previous != undefined {
          start = previous[0][0].begin
          if text.re_match(`(?i)^(of|than|least|most|about|around|over|under|to|and|or|only|just)$|\d$`, previous[0][0].text) { continue }
        }
        begin := starts[i] + lead.begin + start
        matches = append(matches, {begin: begin, end: starts[i] + colon})
        break
      }
    }
  }
tests:
  - name: positives
    about: a cardinal that equals the number of items, with block lists, numbered lists, and inline enumerations
    input: |
      The global list keeps six:

      - a
      - b
      - c
      - d
      - e
      - f

      Three things:

      1. the cache
      2. the queue
      3. the lock

      This PR makes four changes:
      - one
      - two
      - three
      - four

      Sandboxed git failures fall into three groups: locks, writes, and removals.

      It closes the 3 open issues: `#1`, `#2`, and `#3`.

      Here’s what the PR changes, in three steps:
      - parse
      - route
      - render
    want: |
      1:17:Writing.CountedListLeadIn:A count in the lead-in repeats what the list shows. Drop the number: 'keeps:' rather than 'keeps six:'.
      10:1:Writing.CountedListLeadIn:A count in the lead-in repeats what the list shows. Drop the number: 'keeps:' rather than 'keeps six:'.
      16:9:Writing.CountedListLeadIn:A count in the lead-in repeats what the list shows. Drop the number: 'keeps:' rather than 'keeps six:'.
      22:29:Writing.CountedListLeadIn:A count in the lead-in repeats what the list shows. Drop the number: 'keeps:' rather than 'keeps six:'.
      24:11:Writing.CountedListLeadIn:A count in the lead-in repeats what the list shows. Drop the number: 'keeps:' rather than 'keeps six:'.
      26:29:Writing.CountedListLeadIn:A count in the lead-in repeats what the list shows. Drop the number: 'keeps:' rather than 'keeps six:'.
  - name: negatives
    about: counts below three, measurements, fractions, mismatched counts, and a count with no list
    input: |
      Two reasons:

      1. cost
      2. latency

      Node 20: supported.

      Load spikes up to 216 on 10 cores:
      - the index job
      - the backup

      Where the bare connector misses, all 0 of 3:
      - a
      - b
      - c

      The meeting starts at 10:30 today.

      Three reviewers approved the change.

      It found three patterns, described below.

      The release lists five items:

      - one
      - two

      ```text
      Three things:
      - a
      - b
      - c
      ```
    want: ""

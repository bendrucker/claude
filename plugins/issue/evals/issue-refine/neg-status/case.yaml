schema_version: "1.1"
name: neg-status
tags: [negative, dev]
plugins: ["../../..", "../../../../pull-request", "../../../../linear"]
execution:
  model: claude-sonnet-5-5
  max_turns: 10
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  append_system_prompt: >-
    No user will answer questions or approve anything. Finish the request
    as far as the tools you have allow.

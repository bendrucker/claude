[*.{prbody,commitmsg,reviewbody}]
Writing.HedgingClose = YES
Writing.PermissionSeeking = YES
Writing.Salutation = YES
Writing.SycophanticAcknowledgment = YES
Writing.IUnderstand = YES
# Structure and register rules for files, not for a message body.
Writing.FloweryPhrases = NO
Writing.BoldLabel = NO
Writing.TrailingHedge = NO
Writing.ConsequenceChainPronoun = NO
Writing.SoftPhrasing = NO
Writing.SurfaceVerb = NO
# Literal hand-work, which CommitFigurativeVerbs flags as a figure.
TokenIgnores = (?i)\bby hand\b, (?i)\bhand-(?:written|edited|authored|rolled)\b
ai-tells-commits.CommitBuzzwords = warning
ai-tells-commits.CommitChangelogStyle = warning
ai-tells-commits.CommitEmoji = warning
ai-tells-commits.CommitFigurativeVerbs = warning  # literal senses such as holding a lock
ai-tells-commits.CommitFileListing = warning
ai-tells-commits.CommitHedging = warning
ai-tells-commits.CommitMarketingAdjectives = warning
ai-tells-commits.CommitOverexplanation = warning
ai-tells-commits.CommitSelfReference = warning
ai-tells-commits.CommitTestEnumeration = warning
ai-tells-commits.CommitTrailingJustification = warning
ai-tells-commits.CommitUnquantifiedClaims = warning
ai-tells-commits.CommitAttribution = NO  # the Co-Authored-By trailer the harness adds
ai-tells-commits.CommitGitJargon = NO  # "the index" is the session index here
ai-tells-commits.CommitPastTense = NO

# CommitPastTense reads the first line as a subject, which only a commit message has.
[*.commitmsg]
ai-tells-commits.CommitPastTense = warning

[*.reviewbody]
Writing.CodeDensity = YES
Writing.HedgedSuggestion = YES

# CommentSplice covers splices in code comments.
[*.{c,h,cc,cpp,hpp,cs,css,scss,go,java,kt,js,cjs,mjs,jsx,ts,cts,mts,tsx,py,rb,swift}]
ai-tells.SemicolonUsage = NO

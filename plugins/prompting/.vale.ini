StylesPath = styles

# A blockquote is how a prompt shows the wording a rule accepts or rejects, so its prose is named rather than stated.
SkippedScopes = script, style, pre, figure, blockquote

# A prompt held in a text file is read as markdown.
[formats]
txt = md

[*.{md,txt}]
BasedOnStyles = Prompting

# A quoted phrase is named, which is how a document about prompting teaches a rule by showing the wording it rejects. A quote pairs within its own block and steps over code spans.
TokenIgnores = ("(?:[^"`\n]|`[^`\n]*`|\n(?![ \t]*\n))*"), (“(?:[^”`\n]|`[^`\n]*`|\n(?![ \t]*\n))*”), (‘(?:[^’`\n]|`[^`\n]*`|\n(?![ \t]*\n))*’)

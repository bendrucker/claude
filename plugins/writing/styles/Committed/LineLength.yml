# `line_length = 72`: "Number of columns any line with a break can occupy".
# Every line, the subject and trailers included and a URL not exempt,
# counted as committed counts: up to the line's last space, so a line that
# holds one long word has no break and passes. Read from the raw message,
# past Git's own lines. The margin is the script's first line.
extends: script
message: "line_length: this line runs past 72 from '%s'."
link: https://github.com/crate-ci/committed/blob/master/docs/reference.md
level: error
scope: raw
script: |
  max := 72
  subject := false
  text := import("text")
  matches := []
  pos := 0
  first := true
  for line in text.split(scope, "\n") {
    next := pos + len(line) + 1
    if text.re_match(`^#\s*-+\s*>8\s*-+\s*$`, line) {
      break
    }
    if text.has_prefix(line, "#") {
      pos = next
      continue
    }
    trimmed := text.trim_right(line, " \t\r")
    if first {
      if text.trim_space(trimmed) == "" {
        pos = next
        continue
      }
      first = false
    } else if subject {
      break
    }
    // The soft length: the characters before the line's last space, so a
    // line with no break to wrap at is never too long.
    soft := trimmed
    idx := text.last_index(trimmed, " ")
    if idx >= 0 {
      soft = trimmed[:idx]
    } else {
      soft = ""
    }
    n := 0
    for ch in soft {
      n++
    }
    if n > max {
      over := text.re_find(`^.{` + string(max) + `}`, trimmed)
      matches = append(matches, {begin: pos + over[0][0].end, end: pos + len(trimmed)})
    }
    pos = next
  }

tests:
  - name: "before"
    about: "committed's defaults, most of them at once"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      wip: added the parser, which took a while!

      A body line that is long enough to run past the seventy-two columns committed allows a line.
    want: |
      3:73:Committed.LineLength:line_length: this line runs past 72 from 'itted allows a line.'.
  - name: "after"
    about: "the rewrite"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      Add the parser

      A body wrapped at seventy-two columns, as the default asks.
    want: ""

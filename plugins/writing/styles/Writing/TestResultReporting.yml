# evidence: users repeatedly asked the model to stop reporting pass and fail counts or CI status in corrective-feedback moments.
# retire when: corrective-feedback moments stop citing result-reporting language, or the model stops producing it in deliverables.
extends: existence
message: "'%s' reports a test result, count, or CI status. Describe what is covered instead."
link: https://github.com/bendrucker/claude/blob/main/plugins/writing/styles/Writing/TestResultReporting.yml
level: error
ignorecase: true
exceptions:
  - '\b(?:when|if|unless)\b'
tokens:
  - '\b(?:(?:when|if|unless)\s+(?:[a-z-]+\s+){0,3})?(?:tests?|checks?|specs?|suites?|builds?|linters?|lint|typecheck|assertions?|jobs?|pipelines?|workflows?|ci)\s+(?:(?:are|is|was|were|now|all|both|still|also|already|locally|again|then|finally|currently)\s+)*(?:pass(?:es|ed|ing)?|succeed(?:s|ed|ing)?)\b'
  - '\b\d+(?:/\d+)?\s+(?:[a-z-]+\s+){0,2}(?:pass(?:es|ed|ing)?|fail(?:s|ed|ing)?|succeed(?:s|ed|ing)?)\b'
  - '\b(?:all|both|every)\s+(?:[a-z0-9-]+\s+){0,2}(?:pass(?:es|ed|ing)?|green)\b'
  - '\b(?:0|zero)\s+(?:errors?|failures?|warnings?)\b'
  - '\b(?:ci|tests?|checks?|build|lint|typecheck|suite|pipeline)\s+(?:(?:is|are)\s+)?(?:now\s+)?(?:green|clean)\b'
tests:
  - name: "flags All 8 tests pass. Now let me check the linter."
    input: |
      All 8 tests pass. Now let me check the linter.
    contains: [Writing.TestResultReporting]
  - name: "flags 3/3 passing on Sonnet 4.6."
    input: |
      3/3 passing on Sonnet 4.6.
    contains: [Writing.TestResultReporting]
  - name: "flags Both pass on main."
    input: |
      Both pass on main.
    contains: [Writing.TestResultReporting]
  - name: "flags CI is green."
    input: |
      CI is green.
    contains: [Writing.TestResultReporting]
  - name: "flags Zero failures on the last run."
    input: |
      Zero failures on the last run.
    contains: [Writing.TestResultReporting]
  - name: "flags The tests passed locally."
    input: |
      The tests passed locally.
    contains: [Writing.TestResultReporting]
  - name: "allows The tests fail because processInput is now async."
    input: |
      The tests fail because processInput is now async.
    absent: Writing.TestResultReporting
  - name: "allows Write a test for this function."
    input: |
      Write a test for this function.
    absent: Writing.TestResultReporting
  - name: "allows Apply every fix in this one pass."
    input: |
      Apply every fix in this one pass.
    absent: Writing.TestResultReporting
  - name: "allows Both edits land in a single pass."
    input: |
      Both edits land in a single pass.
    absent: Writing.TestResultReporting
  - name: "allows The uninstall pass removes the links."
    input: |
      The uninstall pass removes the links.
    absent: Writing.TestResultReporting
  - name: "allows Start from one clean checkout."
    input: |
      Start from one clean checkout.
    absent: Writing.TestResultReporting
  - name: "allows Pass the flag to skip the cache."
    input: |
      Pass the flag to skip the cache.
    absent: Writing.TestResultReporting
  - name: "allows Retry if the checks pass."
    input: |
      Retry if the checks pass.
    absent: Writing.TestResultReporting

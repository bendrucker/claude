schema_version: "1.1"
name: decide-noise-floor-latency
tags:
  - decide
  - holdout
plugins:
  - ../../..
execution:
  model: claude-sonnet-5-5
  max_turns: 4
  timeout_seconds: 300
  allowed_tools:
    - Skill
  append_system_prompt: "Nothing can be built or run in this session, and nobody answers while you work, so reply once. End the reply with one line naming your decision on the candidate: `Decision: accept`, `Decision: reject`, `Decision: keep unconfirmed`, or `Decision: re-run`."

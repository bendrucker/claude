name: test

on:
  pull_request: {}
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript build
        run: bun run build

  hooks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test .claude/hooks user/hooks

  validate:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate settings
        run: bun packages/validate/settings.ts

      - name: Validate marketplace
        run: bun packages/validate/marketplace.ts

      - name: Check marketplace completeness
        run: ./scripts/check-marketplace.sh

      - name: Check MCP hook matchers
        run: bun scripts/check-mcp-matchers.ts

      - name: Check for unenabled plugins
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! output=$(./scripts/check-enabled-plugins.sh 2>&1); then
            gh pr comment ${{ github.event.pull_request.number }} --body "⚠️ **Warning:** Some marketplace plugins are not enabled in \`.claude/settings.json\`:

          \`\`\`
          $output
          \`\`\`

          Consider adding these to \`enabledPlugins\` if they should be active." || true
          fi

      - name: List local plugins
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          always_args=(
            --always=schemas/
            --always=scripts/
            --always=.github/workflows/test.yml
            --always=.claude-plugin/marketplace.json
            --always=.claude/settings.json
          )
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            readarray -t files < <(gh pr view ${{ github.event.pull_request.number }} --json files -q '.files[].path')
            plugins=$(bun scripts/list-plugins.ts "${always_args[@]}" "${files[@]}")
          else
            plugins=$(bun scripts/list-plugins.ts)
          fi
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

  plugin:
    needs: validate
    if: needs.validate.outputs.plugins != '[]'
    runs-on: ${{ matrix.plugin.runner }}
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.validate.outputs.plugins) }}
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Inspect plugin
        id: inspect
        run: |
          plugin="${{ matrix.plugin.name }}"
          echo "has_plugin_json=$([[ -f "plugins/$plugin/.claude-plugin/plugin.json" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_hooks=$([[ -f "plugins/$plugin/hooks/hooks.json" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_skills=$([[ -d "plugins/$plugin/skills" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_agents=$([[ -d "plugins/$plugin/agents" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_commands=$([[ -d "plugins/$plugin/commands" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_package=$([[ -f "plugins/$plugin/package.json" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_tests=$(find "plugins/$plugin" -name '*.test.ts' | grep -q . && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_integration_tests=$(find "plugins/$plugin" -name '*.integration.ts' | grep -q . && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_swift=$(find "plugins/$plugin" -name '*.swift' | grep -q . && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Claude Code CLI
        run: bun install -g @anthropic-ai/claude-code@latest

      - name: Validate plugin.json
        if: steps.inspect.outputs.has_plugin_json == 'true'
        run: bun packages/validate/plugin.ts "plugins/${{ matrix.plugin.name }}"

      - name: Check for hardcoded version
        if: steps.inspect.outputs.has_plugin_json == 'true'
        run: |
          if jq -e '.version' "plugins/${{ matrix.plugin.name }}/.claude-plugin/plugin.json" > /dev/null; then
            echo "Error: plugin.json should not contain a version field"
            echo "Hardcoded versions prevent plugin updates from propagating"
            exit 1
          fi

      - name: Validate hooks.json
        if: steps.inspect.outputs.has_hooks == 'true'
        run: bun packages/validate/hooks.ts "plugins/${{ matrix.plugin.name }}"

      - name: Validate skill frontmatter
        if: steps.inspect.outputs.has_skills == 'true'
        run: bunx remark "plugins/${{ matrix.plugin.name }}/skills/*/SKILL.md"

      - name: Lint skills
        if: steps.inspect.outputs.has_skills == 'true'
        run: bun run skill-lint "plugins/${{ matrix.plugin.name }}/skills/*"

      - name: Setup Swift
        if: steps.inspect.outputs.has_swift == 'true'
        uses: swift-actions/setup-swift@v2

      - name: Validate Swift syntax
        if: steps.inspect.outputs.has_swift == 'true'
        run: find "plugins/${{ matrix.plugin.name }}" -name "*.swift" -exec swiftc -parse {} +

      - name: Validate agent frontmatter
        if: steps.inspect.outputs.has_agents == 'true'
        run: bunx remark "plugins/${{ matrix.plugin.name }}/agents/*.md"

      - name: Validate command frontmatter
        if: steps.inspect.outputs.has_commands == 'true'
        run: bunx remark "plugins/${{ matrix.plugin.name }}/commands/*.md"

      - name: Build TypeScript
        if: steps.inspect.outputs.has_package == 'true'
        run: |
          if jq -e '.scripts.build' "plugins/${{ matrix.plugin.name }}/package.json" > /dev/null 2>&1; then
            bun run --cwd "plugins/${{ matrix.plugin.name }}" build
          fi

      - name: Install system dependencies
        if: steps.inspect.outputs.has_tests == 'true' && runner.os == 'Linux'
        run: |
          if [[ -f "plugins/${{ matrix.plugin.name }}/package.json" ]]; then
            if jq -e '.dependencies.sharp // .devDependencies.sharp' "plugins/${{ matrix.plugin.name }}/package.json" > /dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y libvips-dev
            fi
            if jq -e '.dependencies.playwright // .devDependencies.playwright' "plugins/${{ matrix.plugin.name }}/package.json" > /dev/null 2>&1; then
              bunx playwright install chromium --with-deps
            fi
          fi

      - name: Run tests
        if: steps.inspect.outputs.has_tests == 'true'
        run: bun test "plugins/${{ matrix.plugin.name }}/"

      - name: Run integration tests
        if: steps.inspect.outputs.has_integration_tests == 'true'
        run: find "./plugins/${{ matrix.plugin.name }}" -name '*.integration.ts' -exec bun test {} +

  plugins:
    needs: [validate, plugin]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check plugin results
        run: |
          if [[ "${{ needs.validate.outputs.plugins }}" == "[]" ]]; then
            echo "No plugins to test"
            exit 0
          fi
          if [[ "${{ needs.plugin.result }}" != "success" ]]; then
            echo "Plugin validation failed"
            exit 1
          fi

  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          folder-path: '.claude/'
          file-path: './CLAUDE.md'

  context:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Claude Code CLI
        run: bun install -g @anthropic-ai/claude-code@latest

      - name: Setup Claude configuration
        run: |
          mkdir -p "$HOME/.claude"
          for item in user/*; do
            ln -sfn "$GITHUB_WORKSPACE/$item" "$HOME/.claude/$(basename "$item")"
          done

      - name: Generate context report
        run: |
          mkdir -p tmp
          echo '## Claude Code Context Usage' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          claude --print '/context' --output-format json --verbose | jq -r '.[1].message.content' | awk '/<local-command-stdout>/{flag=1;next}/<\/local-command-stdout>/{flag=0}flag' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

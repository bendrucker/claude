id: numbering
language: go
severity: error
message: "Numbered identifier creates tight coupling: $NAME"
note: "Use descriptive names instead. See CLAUDE.md Organization guidelines."
rule:
  any:
    - pattern: "func $NAME($$$) { $$$ }"
    - pattern: "func ($RECV) $NAME($$$) { $$$ }"
    - pattern: "const $NAME = $$$"
    - pattern: "var $NAME = $$$"
    - pattern: "type $NAME $$$"
constraints:
  NAME:
    regex: "(?i)(step|phase|part)[0-9]+"

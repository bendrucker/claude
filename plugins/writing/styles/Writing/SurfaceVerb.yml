# evidence: user-flagged 2026-06 as the highest-frequency tell. "Surface" is also a domain noun here ("chat surface", "surface area"), so the determiner after the verb picks out the verb-with-object sense.
# retire when: a sense-aware corpus pass shows the verb usage isn't distinctive against the user baseline.
extends: existence
message: "'%s' uses 'surface' as a verb meaning reveal or report. Say 'show', 'report', or 'expose'."
level: warning
ignorecase: true
tokens:
  - 'surfac(?:e|es|ed|ing)\s+(?:the|a|an|that|this|these|those|any|all|each|its|their|every)'
tests:
  - name: positives
    about: inflected verb forms, including a sentence-initial imperative
    input: |
      The hook should surface the conflict to the user.

      The report surfaces these gaps automatically.

      Surface the PR link in the summary.
    want: |
      1:17:Writing.SurfaceVerb:'surface the' uses 'surface' as a verb meaning reveal or report. Say 'show', 'report', or 'expose'.
      3:12:Writing.SurfaceVerb:'surfaces these' uses 'surface' as a verb meaning reveal or report. Say 'show', 'report', or 'expose'.
      5:1:Writing.SurfaceVerb:'Surface the' uses 'surface' as a verb meaning reveal or report. Say 'show', 'report', or 'expose'.
  - name: negatives
    about: the noun sense
    input: |
      The attack surface is large.

      Reduce the API surface area.
    want: ""

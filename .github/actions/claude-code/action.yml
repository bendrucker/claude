name: Claude Code
description: Install the Claude Code CLI and the sandbox its agent runs need
runs:
  using: composite
  steps:
    # Claude Code confines each agent's shell tools with bubblewrap, and
    # Ubuntu 24.04's AppArmor policy blocks the unprivileged user namespaces
    # it needs.
    - name: Install sandbox dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -q
        sudo apt-get install -y -q bubblewrap socat
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Install Claude Code
      shell: bash
      run: |
        curl -fsSL https://claude.ai/install.sh | bash
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

# "One or more footers MAY be provided one blank line after the body." A
# footer that follows the last line of prose directly is part of the
# paragraph, and a changelog generator reads it as prose. The View only
# takes a trailer block after a blank line, so a footer line still in the
# body is exactly this case.
extends: existence
message: "'%s' is a footer. Put a blank line between the body and the footers."
link: https://www.conventionalcommits.org/en/v1.0.0/#specification
level: warning
scope: body
ignorecase: true
nonword: true
raw:
  - '(?m)^(?:breaking[ -]change|signed-off-by|co-authored-by|reviewed-by|acked-by|tested-by|reported-by|suggested-by|helped-by|see-also|refs?|fixes|closes|resolves|link|cc)(?:: | #).*$'

tests:
  - name: "before"
    about: "a footer glued to the body, a lower-case BREAKING CHANGE, a token with spaces"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      feat(parser)!: allow config objects to extend other configs

      The `extends` key is read before the rest of the file.
      Fixes #12

      Breaking change: the key was ignored before.
      Signed off by: Jane Doe <jane@example.com>
    want: |
      4:1:Conventional.Footer:'Fixes #12' is a footer. Put a blank line between the body and the footers.
  - name: "after"
    about: "the rewrite"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      feat(parser)!: allow config objects to extend other configs

      The `extends` key is read before the rest of the file.

      BREAKING CHANGE: the key was ignored before.
      Signed-off-by: Jane Doe <jane@example.com>
      Fixes #12
    want: ""
  - name: "guards"
    about: "prose that looks like a footer is body, and real footers after a blank line pass"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      docs: correct spelling of CHANGELOG

      Note: a line like this one is prose, and so is the next.
      Reviewed by the team, not a trailer.

      Reviewed-by: Z
      Refs: #123
    want: ""

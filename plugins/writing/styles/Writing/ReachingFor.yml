# evidence: catches the figurative "reach for" that ai-tells.FigurativeReaches misses. Its misses are the noun "reach" and quotations of the pattern.
# retire when: a judged sample of spans no ai-tells check overlaps falls below half real.
extends: existence
message: "'%s' is an AI-flavored figurative construction. Prefer 'use' or 'prefer X over Y'."
link: https://github.com/bendrucker/claude/blob/main/plugins/writing/styles/Writing/ReachingFor.yml
level: error
ignorecase: true
tokens:
  - '\breach(?:ing|es|ed)?\s+for\b'
tests:
  - name: "flags the gerund reaching"
    input: |
      Open a sibling pane rather than reaching for Bash.
    contains: [Writing.ReachingFor]
  - name: "flags the imperative reach"
    input: |
      Reach for the linter before the formatter.
    contains: [Writing.ReachingFor]
  - name: "flags the third-person reaches"
    input: |
      She reaches for the shell first.
    contains: [Writing.ReachingFor]
  - name: "allows reach with a direct object"
    input: |
      She reached the summit by noon.
    absent: Writing.ReachingFor
  - name: "allows reach as a noun"
    input: |
      The fix is within reach.
    absent: Writing.ReachingFor

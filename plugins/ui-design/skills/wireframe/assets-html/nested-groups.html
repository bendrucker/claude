<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 p-0">
  <div class="w-[375px] h-[667px] border border-dashed border-black bg-white flex flex-col">
    <!-- Header -->
    <div class="border-b border-dashed border-black p-4 flex items-center gap-3">
      <span class="text-sm">&larr;</span>
      <h1 class="text-lg font-bold">Profile</h1>
    </div>

    <!-- Avatar section -->
    <div class="border-b border-dashed border-black p-6 flex flex-col items-center">
      <div class="w-20 h-20 border border-dashed border-black flex items-center justify-center text-gray-400 mb-3">[image]</div>
      <div class="font-bold">John Doe</div>
      <div class="text-sm text-gray-500">@johndoe</div>
    </div>

    <!-- Info sections -->
    <div class="flex-1 overflow-auto">
      <!-- Personal Info -->
      <div class="border-b border-dashed border-black p-4">
        <h2 class="text-sm font-bold mb-3">Personal Information</h2>
        <div class="space-y-3">
          <div class="border border-dashed border-black p-3">
            <div class="text-xs text-gray-500 mb-1">Email</div>
            <div class="text-sm">john@example.com</div>
          </div>
          <div class="border border-dashed border-black p-3">
            <div class="text-xs text-gray-500 mb-1">Phone</div>
            <div class="text-sm">(555) 123-4567</div>
          </div>
        </div>
      </div>

      <!-- Address -->
      <div class="border-b border-dashed border-black p-4">
        <h2 class="text-sm font-bold mb-3">Address</h2>
        <div class="border border-dashed border-black p-3">
          <div class="space-y-1">
            <div class="text-sm">123 Main Street</div>
            <div class="text-sm">Apt 4B</div>
            <div class="text-sm">New York, NY 10001</div>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="p-4">
        <h2 class="text-sm font-bold mb-3">Settings</h2>
        <div class="space-y-2">
          <button class="w-full border border-black py-2 text-sm text-left px-3">Edit Profile</button>
          <button class="w-full border border-black py-2 text-sm text-left px-3">Change Password</button>
          <button class="w-full border border-black py-2 text-sm text-left px-3">Log Out</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

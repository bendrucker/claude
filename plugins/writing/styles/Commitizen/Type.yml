# `cz check` matches the message against `cz_conventional_commits`'s
# schema pattern, whose types are build, bump, chore, ci, docs, feat, fix,
# perf, refactor, revert, style, test, in lower case, since the pattern is
# case-sensitive. The rest of it is the spec: `Conventional` covers it, and
# `Commits.Blank` the blank line it requires.
extends: Commitlint.Type
message: "'%s' is not a commitizen type: build, bump, chore, ci, docs, feat, fix, perf, refactor, revert, style, test."
link: https://commitizen-tools.github.io/commitizen/commands/check/
level: error
raw:
  - '^(?!(?:build|bump|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(?:[(!:]))\w+(?=(?:\([^()]*\))?!?:)'

tests:
  - name: "before"
    about: "a type outside cz_conventional_commits's list"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      wip: add the parser
    want: |
      1:1:Commitizen.Type:'wip' is not a commitizen type: build, bump, chore, ci, docs, feat, fix, perf, refactor, revert, style, test.
  - name: "after"
    about: "bump, the one type commitizen adds to the usual list"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      bump: version 1.2.0 → 1.3.0
    want: ""

<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 p-0">
  <div class="w-[375px] h-[667px] border border-dashed border-black bg-white flex flex-col">
    <div class="flex-1 flex flex-col justify-center px-8">
      <h1 class="text-2xl font-bold text-center mb-8">Login</h1>

      <div class="space-y-4">
        <div>
          <label class="block text-sm mb-1">Email</label>
          <input type="email" class="w-full border border-black px-3 py-2 outline-none" placeholder="you@example.com">
        </div>

        <div>
          <label class="block text-sm mb-1">Password</label>
          <input type="password" class="w-full border border-black px-3 py-2 outline-none" placeholder="••••••••">
        </div>

        <button class="w-full border border-black py-2 font-medium">Sign In</button>

        <div class="text-center">
          <a href="#" class="text-sm underline">Forgot password?</a>
        </div>
      </div>
    </div>

    <div class="text-center pb-8">
      <span class="text-sm">Don't have an account? </span>
      <a href="#" class="text-sm underline">Sign up</a>
    </div>
  </div>
</body>
</html>

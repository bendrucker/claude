schema_version: "1.1"
name: multi-case
tags: [batch, dev]
plugins: ["../../.."]
execution:
  model: claude-sonnet-5-5
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]
  append_system_prompt: >-
    Nobody answers while you work, so reply once. Don't edit the program's
    source. End the reply with a markdown table holding one row per benchmark
    case: the case, its top lead, and that lead's share of the case.
context:
  scaffold_script: fixture.sh

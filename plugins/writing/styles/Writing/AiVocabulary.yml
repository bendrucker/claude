# evidence: each vocabulary entry was corpus-audited for lift and distinctiveness (model rate above the voice baseline, count >= 5 in the audit window).
# retire when: an entry falls below the minimum count or stops being distinctive versus the voice baseline. Drop that entry.
extends: existence
message: "'%s' is flagged as AI-typical vocabulary. Use a more natural word."
level: suggestion
ignorecase: true
tokens:
  - '\bdelv(?:e|es|ed|ing)\b'
  - '\btapestr(?:y|ies)\b'
  - '\bmeticulous(?:ly|ness)?\b'
  - '\bleverag(?:e|es|ed|ing)\b'
  - '\brobust(?:ly|ness)?\b'
  - '\bnuanc(?:e|es|ed)\b'
tests:
  - name: "flags Let's delve into the codebase."
    input: |
      Let's delve into the codebase.
    contains: [Writing.AiVocabulary]
  - name: "flags A meticulous review process."
    input: |
      A meticulous review process.
    contains: [Writing.AiVocabulary]
  - name: "flags This is a robust solution."
    input: |
      This is a robust solution.
    contains: [Writing.AiVocabulary]
  - name: "flags We leveraged the cache and it's a rich tapestry."
    input: |
      We leveraged the cache and it's a rich tapestry.
    contains: [Writing.AiVocabulary]
  - name: "flags Mind the nuance, and the nuances."
    input: |
      Mind the nuance, and the nuances.
    contains: [Writing.AiVocabulary]
  - name: "allows The function processes input."
    input: |
      The function processes input.
    absent: Writing.AiVocabulary
  - name: "allows The server returns a result."
    input: |
      The server returns a result.
    absent: Writing.AiVocabulary

schema_version: "1.1"
name: directed-divisor
tags: [holdout]
plugins: ["../.."]
runs: 2
execution:
  model: claude-sonnet-5
  max_turns: 30
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  append_system_prompt: >-
    This sandbox has no network access. Nobody answers while you work,
    so put anything you need from the user in your final reply.
context:
  scaffold_script: fixture.sh

allow_tools: [Bash]
judge_model: claude-sonnet-5-5
wrap:
  skills: [user/skills/ship]
graders:
  format: "*"
  skill-fired: "*"
  stops: "*"
  in-comments-audit: [comments-jsdoc, ho-comments-inline]
  in-pull-request-follow-up: [auth-scope, ho-token-skew]
  in-review-code:
    [
      auth-scope,
      balance-fix,
      comments-jsdoc,
      dirty-docs,
      ho-balance-feature,
      ho-comments-inline,
      ho-dirty-changelog,
      ho-medium-feature,
      ho-prose-changelog,
      ho-refactor-with-default,
      ho-runtime-server,
      ho-stack-base,
      ho-token-skew,
      medium-feature,
      prose-and-code,
      refactor-with-fix,
      runtime-cli,
      skip-human-run,
      stack-base,
    ]
  in-review-human:
    [
      auth-scope,
      balance-fix,
      comments-jsdoc,
      dirty-docs,
      docs-readme,
      force-human,
      ho-balance-feature,
      ho-comments-inline,
      ho-dirty-changelog,
      ho-docs-guide,
      ho-force-human,
      ho-medium-feature,
      ho-owned-alias,
      ho-prose-changelog,
      ho-refactor-move,
      ho-refactor-with-default,
      ho-runtime-server,
      ho-skip-writing,
      ho-stack-base,
      ho-tests-only,
      ho-token-skew,
      medium-feature,
      prose-and-code,
      refactor-extract,
      refactor-with-fix,
      runtime-cli,
      stack-base,
      tests-only,
    ]
  in-run: [ho-runtime-server, runtime-cli]
  in-simplify: [ho-refactor-move, refactor-extract]
  in-writing-review:
    [dirty-docs, docs-readme, ho-dirty-changelog, ho-docs-guide, ho-prose-changelog, prose-and-code]
  not-in-comments-audit:
    [
      auth-scope,
      balance-fix,
      dep-bump,
      dirty-docs,
      docs-readme,
      ho-balance-feature,
      ho-config-tsconfig,
      ho-dirty-changelog,
      ho-docs-guide,
      ho-medium-feature,
      ho-prose-changelog,
      ho-refactor-move,
      ho-refactor-with-default,
      ho-runtime-server,
      ho-skip-writing,
      ho-stack-base,
      ho-tests-only,
      ho-token-skew,
      medium-feature,
      prose-and-code,
      refactor-extract,
      refactor-with-fix,
      runtime-cli,
      stack-base,
      tests-only,
    ]
  not-in-pull-request-follow-up: [dep-bump, ho-config-tsconfig]
  not-in-review-code:
    [
      dep-bump,
      docs-readme,
      force-human,
      ho-config-tsconfig,
      ho-docs-guide,
      ho-force-human,
      ho-refactor-move,
      ho-skip-writing,
      owned-brew,
      refactor-extract,
    ]
  not-in-review-human: [dep-bump, ho-config-tsconfig, owned-brew, skip-human-run]
  not-in-run:
    [
      dep-bump,
      docs-readme,
      force-human,
      ho-config-tsconfig,
      ho-docs-guide,
      ho-force-human,
      ho-tests-only,
      owned-brew,
      skip-human-run,
      tests-only,
    ]
  not-in-simplify:
    [
      auth-scope,
      balance-fix,
      comments-jsdoc,
      dep-bump,
      dirty-docs,
      docs-readme,
      ho-balance-feature,
      ho-comments-inline,
      ho-config-tsconfig,
      ho-dirty-changelog,
      ho-docs-guide,
      ho-medium-feature,
      ho-prose-changelog,
      ho-refactor-with-default,
      ho-runtime-server,
      ho-token-skew,
      medium-feature,
      owned-brew,
      prose-and-code,
      refactor-with-fix,
      runtime-cli,
    ]
  not-in-writing-review:
    [
      auth-scope,
      balance-fix,
      comments-jsdoc,
      ho-balance-feature,
      ho-comments-inline,
      ho-medium-feature,
      ho-refactor-move,
      ho-refactor-with-default,
      ho-runtime-server,
      ho-skip-writing,
      ho-stack-base,
      ho-tests-only,
      ho-token-skew,
      medium-feature,
      refactor-extract,
      refactor-with-fix,
      runtime-cli,
      skip-human-run,
      stack-base,
      tests-only,
    ]
  remote-base: [balance-fix, ho-balance-feature]
  review-code-high: [auth-scope, ho-token-skew]
  review-code-medium: "*medium-feature"

<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400">
  <!-- Page border -->
  <rect width="700" height="400" fill="white" stroke="black" stroke-dasharray="4"/>

  <!-- Header -->
  <g transform="translate(0,0)">
    <rect width="700" height="48" fill="none" stroke="black" stroke-dasharray="4"/>
    <text font-family="sans-serif" x="20" y="30" font-size="16" fill="black">Users</text>
  </g>

  <!-- Table -->
  <g transform="translate(20,68)">
    <!-- Table header row -->
    <g transform="translate(0,0)">
      <rect width="660" height="36" fill="none" stroke="black"/>
      <text font-family="sans-serif" x="16" y="24" font-size="12" fill="black">Name</text>
      <line x1="180" y1="0" x2="180" y2="36" stroke="black"/>
      <text font-family="sans-serif" x="196" y="24" font-size="12" fill="black">Email</text>
      <line x1="400" y1="0" x2="400" y2="36" stroke="black"/>
      <text font-family="sans-serif" x="416" y="24" font-size="12" fill="black">Role</text>
      <line x1="540" y1="0" x2="540" y2="36" stroke="black"/>
      <text font-family="sans-serif" x="556" y="24" font-size="12" fill="black">Actions</text>
    </g>

    <!-- Row 1 -->
    <g transform="translate(0,36)">
      <rect width="660" height="36" fill="none" stroke="black"/>
      <rect x="16" y="12" width="120" height="12" fill="#e0e0e0"/>
      <line x1="180" y1="0" x2="180" y2="36" stroke="black"/>
      <rect x="196" y="12" width="160" height="12" fill="#e0e0e0"/>
      <line x1="400" y1="0" x2="400" y2="36" stroke="black"/>
      <rect x="416" y="12" width="80" height="12" fill="#e0e0e0"/>
      <line x1="540" y1="0" x2="540" y2="36" stroke="black"/>
      <text font-family="sans-serif" x="556" y="24" font-size="11" fill="black" text-decoration="underline">Edit</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0,72)">
      <rect width="660" height="36" fill="none" stroke="black"/>
      <rect x="16" y="12" width="120" height="12" fill="#e0e0e0"/>
      <line x1="180" y1="0" x2="180" y2="36" stroke="black"/>
      <rect x="196" y="12" width="160" height="12" fill="#e0e0e0"/>
      <line x1="400" y1="0" x2="400" y2="36" stroke="black"/>
      <rect x="416" y="12" width="80" height="12" fill="#e0e0e0"/>
      <line x1="540" y1="0" x2="540" y2="36" stroke="black"/>
      <text font-family="sans-serif" x="556" y="24" font-size="11" fill="black" text-decoration="underline">Edit</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0,108)">
      <rect width="660" height="36" fill="none" stroke="black"/>
      <rect x="16" y="12" width="120" height="12" fill="#e0e0e0"/>
      <line x1="180" y1="0" x2="180" y2="36" stroke="black"/>
      <rect x="196" y="12" width="160" height="12" fill="#e0e0e0"/>
      <line x1="400" y1="0" x2="400" y2="36" stroke="black"/>
      <rect x="416" y="12" width="80" height="12" fill="#e0e0e0"/>
      <line x1="540" y1="0" x2="540" y2="36" stroke="black"/>
      <text font-family="sans-serif" x="556" y="24" font-size="11" fill="black" text-decoration="underline">Edit</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(0,144)">
      <rect width="660" height="36" fill="none" stroke="black"/>
      <rect x="16" y="12" width="120" height="12" fill="#e0e0e0"/>
      <line x1="180" y1="0" x2="180" y2="36" stroke="black"/>
      <rect x="196" y="12" width="160" height="12" fill="#e0e0e0"/>
      <line x1="400" y1="0" x2="400" y2="36" stroke="black"/>
      <rect x="416" y="12" width="80" height="12" fill="#e0e0e0"/>
      <line x1="540" y1="0" x2="540" y2="36" stroke="black"/>
      <text font-family="sans-serif" x="556" y="24" font-size="11" fill="black" text-decoration="underline">Edit</text>
    </g>
  </g>

  <!-- Pagination -->
  <g transform="translate(20,320)">
    <text font-family="sans-serif" x="0" y="16" font-size="12" fill="black">Showing 1-4 of 24</text>
    <g transform="translate(500,0)">
      <rect width="32" height="28" fill="none" stroke="black"/>
      <text font-family="sans-serif" x="16" y="18" text-anchor="middle" font-size="12" fill="black">&lt;</text>
      <rect x="40" width="32" height="28" fill="none" stroke="black"/>
      <text font-family="sans-serif" x="56" y="18" text-anchor="middle" font-size="12" fill="black">1</text>
      <rect x="80" width="32" height="28" fill="none" stroke="black"/>
      <text font-family="sans-serif" x="96" y="18" text-anchor="middle" font-size="12" fill="black">2</text>
      <rect x="120" width="32" height="28" fill="none" stroke="black"/>
      <text font-family="sans-serif" x="136" y="18" text-anchor="middle" font-size="12" fill="black">&gt;</text>
    </g>
  </g>
</svg>

# CommentSplice covers splices in code comments.
[*.{c,h,cc,cpp,hpp,cs,css,scss,go,java,kt,js,cjs,mjs,jsx,ts,cts,mts,tsx,py,rb,swift}]
Writing.SemicolonSplice = NO

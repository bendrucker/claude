schema_version: "1.1"
name: pr-015
tags: [holdout]
plugins: ["../../..", "../../../../pull-request", "../../../../issue"]
execution:
  model: claude-opus-5-5
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  append_system_prompt: >-
    This sandbox has no network and nobody answers mid-task. When a push or
    the gh create command fails, reply with the drafted PR inside <out> and
    </out> tags and nothing else: a line Title: <title>, a blank line, then
    the body verbatim. This user's settings blank commit and PR attribution,
    so add no Co-Authored-By trailer and no Generated with Claude Code
    footer.
context:
  scaffold_script: fixture.sh

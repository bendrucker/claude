# `subject_capitalized = true`: the first word of the subject does not start
# with a lower-case letter. committed reads the first word as it stands, so
# under its default `style = "none"` a conventional prefix is the word and
# `feat:` fails; a digit or a bracket passes, as it does there. With
# `style = "conventional"` committed reads the description instead, which
# is DescriptionCapitalized here.
extends: existence
message: "subject_capitalized: '%s'."
link: https://github.com/crate-ci/committed/blob/master/docs/reference.md
level: error
scope: subject
nonword: true
raw:
  - '^\s*\p{Ll}\S*'

tests:
  - name: "before"
    about: "committed's defaults, most of them at once"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      wip: added the parser, which took a while!

      A body line that is long enough to run past the seventy-two columns allowed.
    want: |
      1:1:Committed.SubjectCapitalized:subject_capitalized: 'wip:'.
  - name: "long"
    about: "a subject past fifty columns, a fixup, and a merge"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      fixup! Add a subject that runs well past fifty columns in all
    want: |
      1:1:Committed.SubjectCapitalized:subject_capitalized: 'fixup!'.
  - name: "type"
    about: "the conventional style, on, with its own type list"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      ci: add the workflow

      The workflow runs the suite on every push.
    want: |
      1:1:Committed.SubjectCapitalized:subject_capitalized: 'ci:'.
  - name: "after"
    about: "the rewrite"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      Add the parser

      A body wrapped at seventy-two columns, as the default asks.
    want: ""

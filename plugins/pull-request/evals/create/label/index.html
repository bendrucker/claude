<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PR Body Labels</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <style>
      :root {
        --bg: #f7f7f5;
        --panel: #ffffff;
        --border: #deded8;
        --text: #1d1f23;
        --muted: #6b7079;
        --accent: #2f6fdb;
        --pass: #1f8a4c;
        --fail: #c73a3a;
        --code: #f0f0ec;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0f1115;
          --panel: #171a21;
          --border: #2a313c;
          --text: #d8dee9;
          --muted: #8a94a6;
          --accent: #6aa6ff;
          --pass: #4ec88a;
          --fail: #ff6b6b;
          --code: #11151b;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      header { position: sticky; top: 0; z-index: 1; background: var(--panel); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      header select { flex: 1 1 180px; min-width: 0; font: inherit; padding: 6px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; }
      header .progress { color: var(--muted); font-size: 13px; }
      main { max-width: 760px; margin: 0 auto; padding: 16px 16px 96px; }
      .label { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 22px 0 8px; }
      .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 4px 16px; overflow-wrap: anywhere; }
      .card code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: 13px; }
      .card pre { background: var(--code); padding: 10px; border-radius: 6px; overflow-x: auto; }
      details summary { cursor: pointer; color: var(--muted); padding: 8px 0; }
      .grader { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; }
      .grader h3 { margin: 0 0 4px; font-size: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .grader p { margin: 0 0 10px; }
      .choices { display: flex; gap: 8px; flex-wrap: wrap; }
      button { font: inherit; padding: 8px 14px; min-height: 40px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; }
      button.on[data-v="pass"], button.on[data-v="right"] { background: var(--pass); border-color: var(--pass); color: #fff; }
      button.on[data-v="fail"], button.on[data-v="long"], button.on[data-v="short"] { background: var(--fail); border-color: var(--fail); color: #fff; }
      .judge { margin-top: 8px; font-size: 13px; color: var(--muted); }
      .judge.disagree { color: var(--fail); font-weight: 600; }
      textarea { width: 100%; min-height: 70px; font: inherit; padding: 8px; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; }
      nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel); border-top: 1px solid var(--border); padding: 10px 16px; display: flex; gap: 8px; justify-content: space-between; }
      nav button { flex: 1; }
      .status { font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <select id="pick"></select>
      <span class="progress" id="progress"></span>
      <span class="status" id="status"></span>
    </header>
    <main id="main"></main>
    <nav>
      <button id="prev">Previous</button>
      <button id="next">Next Unlabeled</button>
    </nav>
    <script>
      let run, samples = [], labels = {}, index = 0;
      const $ = (id) => document.getElementById(id);
      const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      const words = (s) => s.trim().split(/\s+/).filter(Boolean).length;
      const key = (s) => `${run}/${s.id}`;
      // A stable shuffle so the arm is not guessable from position.
      const hash = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);

      function done(s) {
        const l = labels[key(s)];
        return l && l.concision && s.graders.every((g) => l.graders?.[g.name]);
      }

      async function save(s, label) {
        labels[key(s)] = label;
        $("status").textContent = "saving…";
        const res = await fetch("/api/labels", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: s.id, label }) });
        $("status").textContent = res.ok ? "saved" : `save failed: ${await res.text()}`;
        renderNav();
      }

      function renderNav() {
        const n = samples.filter(done).length;
        $("progress").textContent = `${n}/${samples.length} labeled`;
        $("pick").innerHTML = samples.map((s, i) => `<option value="${i}" ${i === index ? "selected" : ""}>${done(s) ? "✓" : "○"} ${i + 1}. ${s.case}</option>`).join("");
      }

      function render() {
        const s = samples[index];
        const l = labels[key(s)] ?? { graders: {}, concision: null, note: "" };
        l.graders ??= {};
        const judged = (g) => {
          const mine = l.graders[g.name];
          if (!mine) return "";
          const agree = (mine === "pass") === g.judge;
          return `<div class="judge ${agree ? "" : "disagree"}">Judge: ${g.judge ? "pass" : "fail"} (${esc(g.votes)})${agree ? "" : " · disagrees with you"}</div>`;
        };
        $("main").innerHTML = `
          <div class="label">${esc(s.case)} · body ${index + 1} · ${words(s.body)} words</div>
          <details><summary>Case prompt</summary><div class="card">${marked.parse(s.prompt)}</div></details>
          <div class="card">${marked.parse(s.body || "_(empty body)_")}</div>
          <div class="label">Graders</div>
          ${s.graders.map((g) => `
            <div class="grader">
              <h3>${esc(g.name)}</h3>
              <p>${esc(g.criteria)}</p>
              <div class="choices" data-grader="${esc(g.name)}">
                <button data-v="pass" class="${l.graders[g.name] === "pass" ? "on" : ""}">Pass</button>
                <button data-v="fail" class="${l.graders[g.name] === "fail" ? "on" : ""}">Fail</button>
              </div>
              ${judged(g)}
            </div>`).join("")}
          <div class="label">Concision</div>
          <div class="grader">
            <p>Is this body the right length for what the reviewer needs?</p>
            <div class="choices" data-concision>
              ${[["right", "Right"], ["long", "Too Long"], ["short", "Too Short"]].map(([v, t]) => `<button data-v="${v}" class="${l.concision === v ? "on" : ""}">${t}</button>`).join("")}
            </div>
          </div>
          ${done(s) ? `<div class="judge">Revealed: ${s.arm === "with" ? (s.fired ? "plugin loaded, skill fired" : "plugin loaded, skill did not fire") : "baseline, no plugins"}</div>` : ""}
          <div class="label">Note</div>
          <textarea id="note" placeholder="What should go, what is missing, why a grader is wrong">${esc(l.note ?? "")}</textarea>`;

        document.querySelectorAll("[data-grader] button").forEach((b) => b.onclick = () => {
          l.graders[b.parentElement.dataset.grader] = b.dataset.v;
          save(s, l).then(render);
        });
        document.querySelectorAll("[data-concision] button").forEach((b) => b.onclick = () => {
          l.concision = b.dataset.v;
          save(s, l).then(render);
        });
        $("note").onchange = (e) => { l.note = e.target.value; save(s, l); };
        renderNav();
        window.scrollTo(0, 0);
      }

      $("pick").onchange = (e) => { index = Number(e.target.value); render(); };
      $("prev").onclick = () => { index = (index - 1 + samples.length) % samples.length; render(); };
      $("next").onclick = () => {
        const next = samples.findIndex((s, i) => i > index && !done(s));
        index = next >= 0 ? next : Math.max(0, samples.findIndex((s) => !done(s)));
        render();
      };

      (async () => {
        const data = await (await fetch("/api/samples")).json();
        run = data.run;
        samples = data.samples.sort((a, b) => hash(a.id) - hash(b.id));
        labels = Object.fromEntries(Object.entries(await (await fetch("/api/labels")).json()).filter(([k]) => k.startsWith(`${run}/`)));
        index = Math.max(0, samples.findIndex((s) => !done(s)));
        render();
      })();
    </script>
  </body>
</html>

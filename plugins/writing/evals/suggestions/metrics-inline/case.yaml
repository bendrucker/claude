schema_version: "1.1"
name: metrics-inline
tags: [inline]
plugins: ["../../..", "plugin"]
execution:
  model: claude-sonnet-5-5
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Edit, Write]
  append_system_prompt: >-
    Nobody answers while you work, so finish the task and report in
    your final reply.
context:
  scaffold_script: fixture.sh

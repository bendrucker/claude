# B5 `body-min-length`, `min-length=20`: the characters of every line
# after the title, trailers included and newlines left out, when there is
# at least one such line. A missing body is B6's to report. The count is
# the script's first line.
extends: script
message: "B5 body-min-length: a body of %d characters."
link: https://jorisroovers.com/gitlint/latest/rules/builtin_rules/#b5-body-min-length
level: error
scope: raw
script: |
  min := 20
  t_end := 0
  t_line := ""
  text := import("text")
  matches := []
  pos := 0
  title := -1
  body := []
  lines := text.split(scope, "\n")
  if len(lines) > 0 && lines[len(lines)-1] == "" {
    lines = lines[:len(lines)-1]
  }
  for line in lines {
    next := pos + len(line) + 1
    if text.re_match(`^#\s*-+\s*>8\s*-+\s*$`, line) {
      break
    }
    if text.has_prefix(line, "#") {
      pos = next
      continue
    }
    if title < 0 {
      if text.trim_space(line) != "" {
        title = pos
        title_end := pos + len(line)
        title_line := line
        body = []
        t_end = title_end
        t_line = title_line
      }
      pos = next
      continue
    }
    body = append(body, {line: line, pos: pos})
    pos = next
  }
  n := 0
  for b in body {
    for ch in b.line {
      n++
    }
  }
  if len(body) > 0 && n < min {
    first := body[0]
    matches = append(matches, {begin: first.pos, end: first.pos + len(first.line), message: text.replace("B5 body-min-length: a body of %d characters.", "%d", string(n), 1)})
  }

tests:
  - name: "short body"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      Add a thing

      Short.
    want: |
      2:1:Gitlint.BodyMinLength:B5 body-min-length: a body of 6 characters.
  - name: "short"
    about: "a title under five characters, and no body"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      Fix
    want: ""
  - name: "after"
    about: "the rewrite"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      Add fixed-point parsing to the tokenizer

      Numbers with a decimal point were read as two integers, and the
      second one lost its sign.
    want: ""
  - name: "guards"
    about: "WIPING is a word that contains WIP and passes, as in gitlint"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      Stop WIPING the cache on every request

      The cache was cleared by the request handler rather than by the
      scheduler, so it never held anything for long.
    want: ""

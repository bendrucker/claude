name: test

on:
  pull_request: {}
  push:
    branches:
      - main

jobs:
  hooks:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Install ShellSpec
        run: curl -fsSL https://git.io/shellspec | sh -s -- --yes 0.28.1

      - name: Setup Claude configuration
        run: ./install.sh

      - name: Run hook tests
        run: shellspec
        working-directory: .claude/hooks

  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          folder-path: '.claude/'
          file-path: './CLAUDE.md'

  commands:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate command frontmatter
        run: npm run lint:commands

  context:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Setup Claude configuration
        run: ./install.sh

      - name: Generate context report
        run: |
          mkdir -p tmp
          echo '## Claude Code Context Usage' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          claude --print '/context' --output-format json --verbose | jq -r '.[1].message.content' | awk '/<local-command-stdout>/{flag=1;next}/<\/local-command-stdout>/{flag=0}flag' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

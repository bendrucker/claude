# A document that reports its own progress gives the model unfinished work it cannot act on, and the note outlives the state it describes.
# evidence: a hand audit of every hit across the repo. The rule-precision labels barely exercise it.
# retire when: a hand audit finds most hits describe behavior rather than project status.
extends: existence
message: '"%s" records project status the model cannot act on. Delete the sentence.'
level: error
ignorecase: true
nonword: true
scope: ~text.frontmatter
tokens:
  - '\b(?:has|have) not (?:run|landed|shipped|happened)(?: yet)?\b'
  - '\bnot yet (?:run|wired|built|promoted|calibrated|implemented|landed|shipped|measured)\b'
  - '\(pending\)'
  - '\bcomes next\b'
  - '\bnothing is promoted\b'
  - '\bfor now\b'
  - '\bat the time of writing\b'
  - '\bcoming soon\b'
  - '\bstill (?:pending|outstanding|unbuilt)\b'
tests:
  - name: flags work that has not run
    input: |
      The comparison has not run yet.
    contains: [Prompting.StatusProse]
  - name: flags pending work
    input: |
      Calibration is still pending.
    contains: [Prompting.StatusProse]
  - name: flags the next step
    input: |
      A larger labeled pass comes next.
    contains: [Prompting.StatusProse]
  - name: flags a pending marker
    input: |
      Calibration (pending).
    contains: [Prompting.StatusProse]
  - name: allows an ordinary condition
    input: |
      When something is still open, resolve it first.
    absent: Prompting.StatusProse

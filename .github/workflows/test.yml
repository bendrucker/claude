name: test

on:
  pull_request: {}
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: mcps/cli
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcps/cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run type-check

  install:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake
      THINGS_AUTH_TOKEN: fake
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcps/cli/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mcps/cli

      - name: Run install script
        run: ./install.sh

  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcps/cli/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: mcps/go.mod
          cache-dependency-path: mcps/go.sum

      - name: Install Go tools
        run: go install golang.org/x/tools/gopls@latest

      - name: Install dependencies
        run: npm ci
        working-directory: mcps/cli

      - name: Install TypeScript language server
        run: npm install -g typescript-language-server typescript

      - name: Validate configuration
        run: ./bin/mcp.js validate ..
        working-directory: mcps/cli

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run tools command from parent directory
        run: ./mcps/cli/bin/mcp.js tools mcps --exclude github

  hooks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Claude
        uses: anthropics/claude-code-base-action@beta
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Install ShellSpec
        run: curl -fsSL https://git.io/shellspec | sh -s -- --yes 0.28.1

      - name: Run hook tests
        run: .claude/hooks/test.sh

  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          folder-path: '.claude/'
          file-path: './CLAUDE.md'

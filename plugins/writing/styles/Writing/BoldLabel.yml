# evidence: the `**Label:**` form is a reliable AI-template signal in file writes, and a bold-colon label opening a list item reads as a file manifest or a templated field.
# retire when: the model reliably uses headings instead, or the pattern fires on user-authored markdown at a high rate.
extends: existence
message: "'%s' is a bold label. Use a heading, or fold the label into the sentence."
level: error
scope: raw
nonword: true
tokens:
  - '(?m)^[ \t]*(?:(?:[-*+]|\d+[.)])[ \t]+)?\*\*[^*\n]+(?::\*\*|\*\*[ \t]*:)'
tests:
  - name: positives
    about: bold-colon labels at line start and as list items
    input: |
      **Why:** the diff is small.

      **Note**: this is optional.

      - **Setup:** run the installer.

      * **src/foo.ts**: refactors the helper.

      1. **Result:** it passes.
    want: |
      1:1:Writing.BoldLabel:'**Why:**' is a bold label. Use a heading, or fold the label into the sentence.
      3:1:Writing.BoldLabel:'**Note**:' is a bold label. Use a heading, or fold the label into the sentence.
      5:1:Writing.BoldLabel:'- **Setup:**' is a bold label. Use a heading, or fold the label into the sentence.
      7:1:Writing.BoldLabel:'* **src/foo.ts**:' is a bold label. Use a heading, or fold the label into the sentence.
      9:1:Writing.BoldLabel:'1. **Result:**' is a bold label. Use a heading, or fold the label into the sentence.
  - name: negatives
    about: headings, mid-sentence bold, bold without a colon, and plain list items
    input: |
      #### Why

      The diff is **small** and clear.

      **Important** note about things.

      - Added retry logic to the client.

      Use `**` for bold in this guide.
    want: ""

# `subject_length = 50`: "Number of columns the subject can occupy", counted
# as committed counts, up to the subject's last space, so a long final word
# does not tip it. The limit is the script's first line; committed's own is
# the count of the whole subject in its message, and the alert here starts
# where the limit ends.
extends: script
message: "subject_length: the subject runs past 50 from '%s'."
link: https://github.com/crate-ci/committed/blob/master/docs/reference.md
level: error
scope: raw
script: |
  max := 50
  subject := true
  text := import("text")
  matches := []
  pos := 0
  first := true
  for line in text.split(scope, "\n") {
    next := pos + len(line) + 1
    if text.re_match(`^#\s*-+\s*>8\s*-+\s*$`, line) {
      break
    }
    if text.has_prefix(line, "#") {
      pos = next
      continue
    }
    trimmed := text.trim_right(line, " \t\r")
    if first {
      if text.trim_space(trimmed) == "" {
        pos = next
        continue
      }
      first = false
    } else if subject {
      break
    }
    // The soft length: the characters before the line's last space, so a
    // line with no break to wrap at is never too long.
    soft := trimmed
    idx := text.last_index(trimmed, " ")
    if idx >= 0 {
      soft = trimmed[:idx]
    } else {
      soft = ""
    }
    n := 0
    for ch in soft {
      n++
    }
    if n > max {
      over := text.re_find(`^.{` + string(max) + `}`, trimmed)
      matches = append(matches, {begin: pos + over[0][0].end, end: pos + len(trimmed)})
    }
    pos = next
  }

tests:
  - name: "long"
    about: "a subject past fifty columns, a fixup, and a merge"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      fixup! Add a subject that runs well past fifty columns in all
    want: |
      1:51:Committed.SubjectLength:subject_length: the subject runs past 50 from 'umns in all'.
  - name: "after"
    about: "the rewrite"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      Add the parser

      A body wrapped at seventy-two columns, as the default asks.
    want: ""

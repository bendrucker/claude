name: eval

# CI runs use tracked fixtures only (each harness's fixtures/ materialized from
# in-repo skill sources plus its scenarios/). S3 corpora never reach this
# workflow. Harnesses live at plugins/<plugin>/evals/<suite>.

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      suite:
        description: Suite directory, such as plugins/pull-request/evals/create
        type: string
        required: true
      args:
        description: Extra arguments for claude plugin eval on a native suite, such as --runs 1 --case <name>
        type: string
        default: ""
      ref:
        description: Git ref to read a native suite's skills and plugins at, while the cases come from the dispatched branch
        type: string
        default: ""
      baseline:
        description: Comma-separated run ids of the same native suite, pooled and compared against in the job summary
        type: string
        default: ""

# Each dispatch is its own group, so replicate runs on one branch do not
# cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Manual dispatch runs the named suite. A PR run additionally needs
    # the `eval` label, since these are live model calls against a budget.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'eval')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      promptfoo: ${{ steps.select.outputs.promptfoo }}
      native: ${{ steps.select.outputs.native }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A suite's files name its runner: a promptfooconfig.yaml, or case
      # directories for claude plugin eval. A labeled PR runs the promptfoo
      # suites of every plugin it touches. Native suites run on dispatch only.
      - name: Select suites
        id: select
        env:
          EVENT: ${{ github.event_name }}
          SUITE: ${{ inputs.suite }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          promptfoo=()
          native=""
          if [ "$EVENT" = workflow_dispatch ]; then
            suite=${SUITE%/}
            if [ -f "$suite/promptfooconfig.yaml" ]; then
              promptfoo=("$suite")
            elif compgen -G "$suite/*/case.yaml" > /dev/null; then
              native=$suite
            else
              echo "::error::$suite holds neither a promptfooconfig.yaml nor */case.yaml."
              exit 1
            fi
          else
            for plugin in $(git diff --name-only "$BASE" HEAD | awk -F/ '$1 == "plugins" { print $2 }' | sort -u); do
              for config in plugins/"$plugin"/evals/*/promptfooconfig.yaml; do
                if [ -f "$config" ]; then
                  promptfoo+=("$(dirname "$config")")
                fi
              done
            done
          fi
          {
            echo "promptfoo=$(jq -cn '$ARGS.positional' --args "${promptfoo[@]}")"
            echo "native=$native"
          } >> "$GITHUB_OUTPUT"

  eval:
    needs: changes
    if: needs.changes.outputs.promptfoo != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.changes.outputs.promptfoo) }}
    env:
      PROMPTFOO_CONFIG_DIR: ${{ github.workspace }}/.promptfoo
      SUITE_DIR: ${{ matrix.suite }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: ./.github/actions/bun-install

      - name: Name suite
        run: |
          name=${SUITE_DIR#plugins/}
          echo "SUITE=${name//\//-}" >> "$GITHUB_ENV"

      # A suite with generated cases declares a `cases` script. Generated cases
      # drift silently, and the check costs nothing and runs ahead of the
      # credential gate, so drift fails the job before a single model call is billed.
      - name: Check eval cases
        working-directory: ${{ env.SUITE_DIR }}
        run: |
          set -euo pipefail
          if jq -e '.scripts.cases' package.json > /dev/null 2>&1; then
            bun run cases --check
          fi

      - name: Check for eval credentials
        id: check
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice
        if: steps.check.outputs.has_key == 'false'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set, so the $SUITE eval is skipped. Add the secret (from 'claude setup-token') to enable live runs."

      # A suite whose providers point at a fixture tree declares a `fixtures`
      # script. The tree is git-ignored, so the run materializes it here,
      # ahead of the credential steps: the script runs with no token in the
      # environment and no credentials file on disk.
      - name: Materialize fixtures
        if: steps.check.outputs.has_key == 'true'
        working-directory: ${{ env.SUITE_DIR }}
        run: |
          set -euo pipefail
          if jq -e '.scripts.fixtures' package.json > /dev/null 2>&1; then
            bun run fixtures
          fi

      # The spawned CLI reads the token from the environment. promptfoo's grader
      # providers only read it from ~/.claude/.credentials.json on Linux.
      - name: Write grader credentials
        if: steps.check.outputs.has_key == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.claude"
          jq -n --arg token "$CLAUDE_CODE_OAUTH_TOKEN" '{claudeAiOauth: {accessToken: $token}}' > "$HOME/.claude/.credentials.json"
          chmod 600 "$HOME/.claude/.credentials.json"

      # `continue-on-error` lets a failing eval still upload, summarize, and
      # comment before the last step turns the job red.
      - name: Run promptfoo eval
        if: steps.check.outputs.has_key == 'true'
        id: eval
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        working-directory: ${{ env.SUITE_DIR }}
        run: bunx promptfoo eval --no-progress-bar -o output.json

      - name: Upload results
        if: steps.eval.outcome != 'skipped' && hashFiles(format('{0}/output.json', env.SUITE_DIR)) != ''
        uses: actions/upload-artifact@v7
        with:
          name: promptfoo-${{ env.SUITE }}-${{ github.run_id }}
          path: ${{ env.SUITE_DIR }}/output.json

      - name: Summarize results
        if: steps.eval.outcome != 'skipped' && hashFiles(format('{0}/output.json', env.SUITE_DIR)) != ''
        id: summary
        working-directory: ${{ env.SUITE_DIR }}
        run: |
          set -euo pipefail
          successes=$(jq '.results.stats.successes // 0' output.json)
          failures=$(jq '.results.stats.failures // 0' output.json)
          errors=$(jq '.results.stats.errors // 0' output.json)
          total=$((successes + failures + errors))
          pass_rate=$(awk -v s="$successes" -v t="$total" 'BEGIN { printf (t > 0) ? "%.1f" : "0.0", (t > 0 ? s / t * 100 : 0) }')
          total_cost=$(jq '([.results.results[]?.cost // 0] | add // 0) * 100 | round / 100' output.json)
          {
            echo "pass_rate=$pass_rate"
            echo "total_cost=$total_cost"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## promptfoo eval: $SUITE"
            echo ""
            echo "pass rate: ${pass_rate}% ($successes/$total) · total cost: \$${total_cost}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update PR comment
        if: steps.summary.outcome == 'success' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PASS_RATE: ${{ steps.summary.outputs.pass_rate }}
          TOTAL_COST: ${{ steps.summary.outputs.total_cost }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="<!-- promptfoo-eval:${SUITE} -->"
          body=$(cat <<BODY
          ${marker}
          ### promptfoo eval: \`${SUITE}\`

          | metric | value |
          | --- | --- |
          | pass rate | ${PASS_RATE}% |
          | total cost | \$${TOTAL_COST} |

          [Full run](${RUN_URL})
          BODY
          )
          existing_id=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n1)
          if [ -n "$existing_id" ]; then
            gh api "repos/${REPO}/issues/comments/${existing_id}" -X PATCH -f body="$body"
          else
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" -X POST -f body="$body"
          fi

      - name: Surface eval failure
        if: steps.eval.outcome == 'failure'
        run: exit 1

  # One run of a native suite is cases x runs x arms agent sessions plus a
  # judge vote per llm grader, so it runs on dispatch only.
  native:
    needs: changes
    if: needs.changes.outputs.native != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      checks: write
    env:
      SUITE_DIR: ${{ needs.changes.outputs.native }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check suite and credentials
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Add the secret (from 'claude setup-token') to run native evals."
            exit 1
          fi
          name=${SUITE_DIR#plugins/}
          echo "SUITE=${name//\//-}" >> "$GITHUB_ENV"

      # Skill context injection runs scripts with bun, and the runner and
      # compare.ts need the workspace dependencies.
      - uses: ./.github/actions/bun-install

      - uses: ./.github/actions/claude-code

      # --threshold 0 leaves the exit code to runner errors. Scores are read
      # from aggregate-result.json, where a case below 1.0 is the normal state.
      - name: Run eval
        id: eval
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ARGS: ${{ inputs.args }}
          REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ref=()
          if [ -n "$REF" ]; then
            # git fetch takes a full SHA only, so resolve a short one, or a
            # branch or tag, through the API first.
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)
            git fetch --no-tags origin "$sha"
            ref=(--ref FETCH_HEAD --label "${REF//\//-}")
          fi
          # xargs splits the input the way a shell would, removing quotes
          # without expanding globs, so --case 'quiet-*' reaches the runner.
          mapfile -d '' -t args < <(xargs -r printf '%s\0' <<<"$ARGS")
          bun evals/native/run.ts "$SUITE_DIR" "${ref[@]}" -- --no-publish --threshold 0 --concurrency 4 "${args[@]}"

      - name: Upload results
        if: steps.eval.outcome != 'skipped' && hashFiles(format('{0}/results/*/aggregate-result.json', env.SUITE_DIR)) != ''
        uses: actions/upload-artifact@v7
        with:
          name: eval-${{ env.SUITE }}-${{ github.run_id }}
          path: ${{ env.SUITE_DIR }}/results/

      # The report lands in the job summary and in a check on the commit that
      # ran, so a pull request links to results instead of pasting them. A
      # baseline adds compare.ts tables against the pooled baseline runs.
      - name: Write report
        id: report
        if: steps.eval.outcome != 'skipped' && hashFiles(format('{0}/results/*/aggregate-result.json', env.SUITE_DIR)) != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE: ${{ inputs.baseline }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          results=("$SUITE_DIR"/results/*/aggregate-result.json)
          result=${results[-1]}
          report="$RUNNER_TEMP/report.md"
          title=$(jq -r '
            # A suite whose cases all lack a without arm has no delta.
            def pct: (. * 100 | round | tostring) + "%";
            "score \(.aggregates.overallScore | pct)"
              + if .aggregates.meanDelta == null then "" else ", \(.aggregates.meanDelta | pct) over no plugin" end
          ' "$result")
          jq -r --arg run "$RUN_URL" '
            def pct: if . == null then "–" else (. * 100 | round | tostring) + "%" end;
            "\(.aggregates.casesTotal) cases · cost $\(.costUsd * 100 | round / 100) · [run](\($run))",
            "",
            "| case | with | without | delta |",
            "| --- | --- | --- | --- |",
            (.cases[] | "| \(.name) | \(.aggregates.score | pct) | \(.aggregates.scoreWithout | pct) | \(.aggregates.delta | pct) |")
          ' "$result" > "$report"
          if [ -n "$BASELINE" ]; then
            IFS=, read -ra ids <<< "$BASELINE"
            for id in "${ids[@]}"; do
              gh run download "$id" --dir "$RUNNER_TEMP/baseline/$id"
            done
            pooled=$(printf '%s,' "$RUNNER_TEMP"/baseline/*/*/*/aggregate-result.json)
            compared=$(bun evals/native/compare.ts --markdown --suite "$SUITE_DIR" --label "run $BASELINE" --label "this run" "${pooled%,}" "$result")
            flagged=$(sed '/<details>/q' <<< "$compared" | grep -c '^|.*\* |' || true)
            title="$title, $flagged flagged against run $BASELINE"
            printf '\n%s\n' "$compared" >> "$report"
          fi
          {
            echo "## $SUITE: $title"
            echo ""
            cat "$report"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Publish check
        if: steps.report.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TITLE: ${{ steps.report.outputs.title }}
        run: |
          gh api "repos/$REPO/check-runs" --silent \
            -f name="eval / $SUITE" -f head_sha="$SHA" \
            -f status=completed -f conclusion=neutral \
            -f "output[title]=$TITLE" -F "output[summary]=@$RUNNER_TEMP/report.md"

      - name: Surface eval failure
        if: steps.eval.outcome == 'failure'
        run: exit 1

# evidence: the retired CROSS_SENTENCE_NOT regex had 8 hits in 2 sessions over 30 days.
#   Session-corpus calibration pending.
# retire when: the pattern fires at comparable rates on user text, or session-corpus calibration shows
#   precision below the hook bar.
extends: existence
message: "'%s' concedes right after a negated sentence. Negating then conceding with 'However/But/Yet' is an AI prose pattern. Merge into a single sentence or drop the negation."
level: suggestion
nonword: true
ignorecase: true
tokens:
  - '(?<=(?:\b(?:not|never)\b|\bno\s|n[''’]t\b)(?:[^.!?]|[.!?](?!\s))*(?<!\d)[.!?]+\s+)(?:however|but|yet|nevertheless|nonetheless|still|that said)(?=,?\s)'
tests:
  - name: "flags The cache does not warm instantly. However, the first req..."
    input: |
      The cache does not warm instantly. However, the first request fills it.
    contains: [Writing.AdversativeNegationFlip]
  - name: "flags This isn't a regression. But it does change observed beha..."
    input: |
      This isn't a regression. But it does change observed behavior.
    contains: [Writing.AdversativeNegationFlip]
  - name: "flags This isn’t a regression. Still, it changes observed behav..."
    input: |
      This isn’t a regression. Still, it changes observed behavior.
    contains: [Writing.AdversativeNegationFlip]
  - name: "flags The worker never retries v1.2 jobs. Yet the queue drains."
    input: |
      The worker never retries v1.2 jobs. Yet the queue drains.
    contains: [Writing.AdversativeNegationFlip]
  - name: "allows The cache fills on first request. However, it can evict u..."
    input: |
      The cache fills on first request. However, it can evict under pressure.
    absent: Writing.AdversativeNegationFlip
  - name: "allows The server starts. The queue drains."
    input: |
      The server starts. The queue drains.
    absent: Writing.AdversativeNegationFlip
  - name: "allows The notable design held up under load. However, the rollo..."
    input: |
      The notable design held up under load. However, the rollout was slow.
    absent: Writing.AdversativeNegationFlip
  - name: "allows The cache is not warm. The first request fills it. Howeve..."
    input: |
      The cache is not warm. The first request fills it. However, the second is fast.
    absent: Writing.AdversativeNegationFlip
  - name: "allows The cache is not warm."
    input: |
      The cache is not warm.
    absent: Writing.AdversativeNegationFlip
  - name: "allows However, the first request fills it."
    input: |
      However, the first request fills it.
    absent: Writing.AdversativeNegationFlip

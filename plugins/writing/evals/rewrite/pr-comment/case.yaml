schema_version: "1.1"
name: pr-comment
tags: [holdout]
plugins: ["../../.."]
execution:
  model: claude-sonnet-5
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
  append_system_prompt: >-
    Reply with the complete rewritten text between a line holding only <rewrite> and a line holding only </rewrite>. Anything else you say goes outside the tags.
